name: ci

# The gate. A breaking contract change, a failing suite, or a broken end-to-end pipeline
# turns this red and locks merge. Wired from Phase 0 — v1's #1 process failure was tests
# that never gated.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-drift:
    name: 1/5 • contracts drift gate (schema ⇄ generated)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate from schema and fail on drift
        run: bash packages/contracts/scripts/check_drift.sh

  python-tests:
    name: 2/5 • pytest • ${{ matrix.pkg }}
    runs-on: self-hosted
    needs: contracts-drift
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - packages/contracts/py
          - doomberg-core
          - services/platform
          - services/mcp-gateway
          - services/control-plane
          - services/rest-gateway
          - services/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: pytest
        working-directory: ${{ matrix.pkg }}
        run: uv run --extra dev pytest -q

  demo-e2e:
    name: 3/5 • end-to-end pipelines
    runs-on: self-hosted
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --extra dev
      # research → propose → backtest → observe
      - run: uv run python scripts/demo_e2e.py
      # control plane enqueues → worker pulls the queue → paper money path applied
      - run: uv run python scripts/demo_deploy.py

  contracts-test-ts:
    name: 4/5 • contracts zod round-trip
    runs-on: self-hosted
    needs: demo-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: vitest
        run: pnpm --filter @doomberg/contracts run test

  web:
    name: 5/5 • web typecheck + build + test
    runs-on: self-hosted
    needs: contracts-test-ts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @doomberg/web run test
      - run: pnpm --filter @doomberg/web run build
