name: ci

# The gate. A breaking contract change, a failing suite, or a broken end-to-end pipeline
# turns this red and locks merge. Wired from Phase 0 — v1's #1 process failure was tests
# that never gated.
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-drift:
    name: 1/5 • contracts drift gate (schema ⇄ generated)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up uv
        run: bash .github/scripts/setup_uv.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Regenerate from schema and fail on drift
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          bash packages/contracts/scripts/check_drift.sh

  python-tests:
    name: 2/5 • pytest workspace
    runs-on: self-hosted
    needs: contracts-drift
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up uv
        run: bash .github/scripts/setup_uv.sh
      - name: pytest
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          for pkg in \
            packages/contracts/py \
            doomberg-core \
            services/platform \
            services/mcp-gateway \
            services/control-plane \
            services/rest-gateway \
            services/runtime
          do
            echo "pytest ${pkg}"
            (cd "${pkg}" && uv run --extra dev pytest -q)
          done

  demo-e2e:
    name: 3/5 • end-to-end pipelines
    runs-on: self-hosted
    needs: python-tests
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up uv
        run: bash .github/scripts/setup_uv.sh
      - run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          uv sync --all-packages --extra dev
      # research → propose → backtest → observe
      - run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          uv run python scripts/demo_e2e.py
      # control plane enqueues → worker pulls the queue → paper money path applied
      - run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          uv run python scripts/demo_deploy.py

  contracts-test-ts:
    name: 4/5 • contracts zod round-trip
    runs-on: self-hosted
    needs: demo-e2e
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: vitest
        run: pnpm --filter @doomberg/contracts run test

  web:
    name: 5/5 • web typecheck + build + test
    runs-on: self-hosted
    needs: contracts-test-ts
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @doomberg/web run test
      - run: pnpm --filter @doomberg/web run build
