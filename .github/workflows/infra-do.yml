name: infra-do

on:
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to plan (prod or dev)"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod]
      apply:
        description: "Apply Terraform. Requires remote state migration first."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: infra-do-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform:
    name: terraform plan
    runs-on: self-hosted
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.15.6"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            terraform init -backend=false -input=false
          else
            terraform init -input=false
          fi

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TERRAFORM_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
          DATA_GATEWAY_NAMESPACE: ${{ vars.K8S_GATEWAY_NAMESPACE || 'ithaca-dev-gateway' }}
          WORKER_NAMESPACE: ${{ vars.K8S_WORKER_NAMESPACE || 'ithaca-dev-workers' }}
        run: |
          set -euo pipefail
          terraform plan -input=false \
            -var="environment=${TERRAFORM_ENVIRONMENT}" \
            -var="data_gateway_namespace=${DATA_GATEWAY_NAMESPACE}" \
            -var="worker_namespace=${WORKER_NAMESPACE}"

      - name: Apply guard
        if: github.event_name == 'workflow_dispatch' && inputs.apply
        run: |
          echo "Terraform apply from GitHub is intentionally blocked until remote state is migrated and reviewed." >&2
          exit 1
