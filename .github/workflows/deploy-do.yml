name: deploy-do

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-do-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify deploy target
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ steps.classify.outputs.deploy_env }}
      image_tag: ${{ steps.classify.outputs.image_tag }}
      short_sha: ${{ steps.classify.outputs.short_sha }}
      push_latest: ${{ steps.classify.outputs.push_latest }}
    steps:
      - id: classify
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF#refs/heads/}"
          short="${GITHUB_SHA::7}"
          safe_ref="$(printf '%s' "${ref}" | tr '[:upper:]/' '[:lower:]-' | tr -cd 'a-z0-9._-' | cut -c1-40)"
          if [[ "${ref}" == "main" ]]; then
            deploy_env="prod"
            image_tag="${short}"
            push_latest="true"
          else
            deploy_env="dev"
            image_tag="dev-${safe_ref}-${short}"
            push_latest="false"
          fi
          {
            echo "deploy_env=${deploy_env}"
            echo "image_tag=${image_tag}"
            echo "short_sha=${short}"
            echo "push_latest=${push_latest}"
          } >> "${GITHUB_OUTPUT}"

  checks:
    name: deploy gates
    runs-on: ubuntu-latest
    needs: classify
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Python workspace sync
        run: uv sync --all-packages --extra dev

      - name: Contract drift
        run: bash packages/contracts/scripts/check_drift.sh

      - name: Demo pipelines
        run: |
          set -euo pipefail
          uv run python scripts/demo_e2e.py
          uv run python scripts/demo_deploy.py

      - name: Web and contracts
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @doomberg/contracts run test
          pnpm --filter @doomberg/web run test
          pnpm --filter @doomberg/web run build

      - uses: docker/setup-buildx-action@v3

      - name: Docker image build smoke
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: doomberg:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Service role smoke
        run: |
          set -euo pipefail
          docker run --rm doomberg:ci shell -c \
            'python -c "import doomberg_core, doomberg_platform, doomberg_runtime, doomberg_rest, doomberg_control, doomberg_mcp; print(\"imports OK\")"'
          cid="$(docker run -d -e DOOMBERG_DB=:memory: doomberg:ci conductor)"
          sleep 5
          docker logs "$cid" | grep -q "doomberg conductor up"
          docker rm -f "$cid"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"

      - name: Terraform deploy-layer checks
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate -no-color
          if out="$(terraform plan -input=false -var='backtest_node_size=gpu-h100x1-80gb' 2>&1)"; then
            echo "FAIL: plan accepted a GPU node slug"
            echo "$out"
            exit 1
          fi
          echo "$out" | grep -qi "CPU-ONLY GUARDRAIL"

  build-push:
    name: build and push image
    runs-on: ubuntu-latest
    needs: [classify, checks]
    environment: ${{ needs.classify.outputs.deploy_env }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Resolve registry
        shell: bash
        env:
          REGISTRY_NAME: ${{ vars.REGISTRY_NAME }}
        run: echo "REGISTRY_NAME=${REGISTRY_NAME:-doomberg}" >> "${GITHUB_ENV}"

      - name: Login to DOCR
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: registry.digitalocean.com/${{ env.REGISTRY_NAME }}/doomberg:${{ needs.classify.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            VITE_GITHUB_CLIENT_ID=${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
            VITE_OAUTH_REDIRECT=https://${{ vars.APP_HOST }}/auth/callback
            VITE_API_BASE=/api

  deploy:
    name: deploy to ${{ needs.classify.outputs.deploy_env }}
    runs-on: ubuntu-latest
    needs: [classify, build-push]
    environment: ${{ needs.classify.outputs.deploy_env }}
    concurrency:
      group: deploy-${{ needs.classify.outputs.deploy_env }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Resolve deploy environment
        shell: bash
        env:
          DEPLOY_ENV: ${{ needs.classify.outputs.deploy_env }}
          IMAGE_TAG: ${{ needs.classify.outputs.image_tag }}
          REGISTRY_NAME: ${{ vars.REGISTRY_NAME }}
          DO_CLUSTER_NAME: ${{ vars.DO_CLUSTER_NAME }}
          K8S_GATEWAY_NAMESPACE: ${{ vars.K8S_GATEWAY_NAMESPACE }}
          K8S_WORKER_NAMESPACE: ${{ vars.K8S_WORKER_NAMESPACE }}
          APP_HOST: ${{ vars.APP_HOST }}
          MCP_HOST: ${{ vars.MCP_HOST }}
        run: |
          set -euo pipefail
          {
            echo "DEPLOY_ENV=${DEPLOY_ENV}"
            echo "IMAGE_TAG=${IMAGE_TAG}"
            echo "REGISTRY_NAME=${REGISTRY_NAME:-doomberg}"
            echo "DO_CLUSTER_NAME=${DO_CLUSTER_NAME}"
            echo "K8S_GATEWAY_NAMESPACE=${K8S_GATEWAY_NAMESPACE}"
            echo "K8S_WORKER_NAMESPACE=${K8S_WORKER_NAMESPACE}"
            echo "APP_HOST=${APP_HOST}"
            echo "MCP_HOST=${MCP_HOST}"
            echo "WORKER_IMAGE=registry.digitalocean.com/${REGISTRY_NAME:-doomberg}/doomberg:${IMAGE_TAG}"
          } >> "${GITHUB_ENV}"

      - name: Ref freshness guard
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${DEPLOY_ENV}" == "prod" ]]; then
            git fetch origin main
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          fi

      - name: Save kubeconfig
        run: doctl kubernetes cluster kubeconfig save "${DO_CLUSTER_NAME}"

      - name: Deploy services
        env:
          LOAD_LOCAL_ENV: "0"
          DOOMBERG_ARCHIVE_URL: ${{ secrets.DOOMBERG_ARCHIVE_URL }}
          DOOMBERG_SESSION_SECRET: ${{ secrets.DOOMBERG_SESSION_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          DOOMBERG_ADMIN_TOKEN: ${{ secrets.DOOMBERG_ADMIN_TOKEN }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: bash deploy/deploy_services.sh

      - name: HTTP health checks
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 5 "https://${APP_HOST}/healthz"
          code="$(curl -sS -o /tmp/doomberg-mcp-response.txt -w "%{http_code}" "https://${MCP_HOST}/mcp")"
          test "${code}" = "401"

  mark-latest:
    name: mark prod latest
    runs-on: ubuntu-latest
    needs: [classify, deploy]
    if: needs.classify.outputs.push_latest == 'true'
    environment: prod
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Resolve registry
        shell: bash
        env:
          REGISTRY_NAME: ${{ vars.REGISTRY_NAME }}
        run: echo "REGISTRY_NAME=${REGISTRY_NAME:-doomberg}" >> "${GITHUB_ENV}"

      - name: Login to DOCR
        run: doctl registry login --expiry-seconds 1200

      - name: Move latest to deployed prod image
        run: |
          docker buildx imagetools create \
            -t "registry.digitalocean.com/${REGISTRY_NAME}/doomberg:latest" \
            "registry.digitalocean.com/${REGISTRY_NAME}/doomberg:${{ needs.classify.outputs.image_tag }}"
