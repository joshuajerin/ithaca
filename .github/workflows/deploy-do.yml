name: Deploy
run-name: Deploy ${{ github.event.inputs.deploy_env || 'production' }} @ ${{ github.sha }}

# A deployment is only needed when the application or its infrastructure changes.
# Marketing, docs, and workflow-only commits keep their normal CI/Vercel checks and
# never create a DigitalOcean deployment run.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - Dockerfile.ibkr-engine
      - .dockerignore
      - doomberg-core/**
      - services/**
      - packages/**
      - scripts/**
      - deploy/**
      - infra/terraform/**
      - web/**
      - pyproject.toml
      - uv.lock
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:
    inputs:
      deploy_env:
        description: Target environment
        required: true
        default: dev
        type: choice
        options: [dev, prod]
      mode:
        description: Apply the deployment or validate it without mutation
        required: true
        default: dry-run
        type: choice
        options: [dry-run, deploy]

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.deploy_env || 'prod' }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.deploy_env || 'production' }}
    runs-on: self-hosted
    environment: ${{ github.event.inputs.deploy_env || 'prod' }}
    env:
      DEPLOY_ENV: ${{ github.event.inputs.deploy_env || 'prod' }}
      DEPLOY_MODE: ${{ github.event.inputs.mode || 'deploy' }}
      IMAGE_TAG: ${{ github.sha }}
      LOAD_LOCAL_ENV: "0"
      REGISTRY_NAME: ${{ vars.REGISTRY_NAME || 'ithaca' }}
      DO_CLUSTER_NAME: ${{ vars.DO_CLUSTER_NAME }}
      K8S_GATEWAY_NAMESPACE: ${{ vars.K8S_GATEWAY_NAMESPACE }}
      K8S_WORKER_NAMESPACE: ${{ vars.K8S_WORKER_NAMESPACE }}
      APP_HOST: ${{ vars.APP_HOST }}
      MCP_HOST: ${{ vars.MCP_HOST }}
      REST_NODE_PORT: ${{ vars.REST_NODE_PORT }}
      MCP_NODE_PORT: ${{ vars.MCP_NODE_PORT }}
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      ITHACA_PLATFORM_DB_URL: ${{ secrets.ITHACA_PLATFORM_DB_URL }}
      ITHACA_SESSION_SECRET: ${{ secrets.ITHACA_SESSION_SECRET }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PEM_PUBLIC_KEY: ${{ secrets.CLERK_PEM_PUBLIC_KEY }}
      CLERK_JWKS_URL: ${{ vars.CLERK_JWKS_URL }}
      CLERK_ALLOWED_ORIGINS: ${{ vars.CLERK_ALLOWED_ORIGINS }}
      CLERK_ISSUER: ${{ vars.CLERK_ISSUER }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ITHACA_ADAPTIVE_DASHBOARD_PROVIDER: ${{ vars.ITHACA_ADAPTIVE_DASHBOARD_PROVIDER || 'modal' }}
      ITHACA_ADAPTIVE_DASHBOARD_OPENAI_BASE_URL: ${{ vars.ITHACA_ADAPTIVE_DASHBOARD_OPENAI_BASE_URL }}
      ITHACA_ADAPTIVE_DASHBOARD_API_KEY: ${{ secrets.ITHACA_ADAPTIVE_DASHBOARD_API_KEY }}
      ITHACA_ADAPTIVE_DASHBOARD_MODAL_KEY: ${{ secrets.ITHACA_ADAPTIVE_DASHBOARD_MODAL_KEY }}
      ITHACA_ADAPTIVE_DASHBOARD_MODAL_SECRET: ${{ secrets.ITHACA_ADAPTIVE_DASHBOARD_MODAL_SECRET }}
      ITHACA_ADAPTIVE_DASHBOARD_MODEL: ${{ vars.ITHACA_ADAPTIVE_DASHBOARD_MODEL || 'google/gemma-4-E4B-it' }}
      ITHACA_ADMIN_TOKEN: ${{ secrets.ITHACA_ADMIN_TOKEN }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      ITHACA_SMOKE_API_KEY: ${{ secrets.ITHACA_SMOKE_API_KEY }}
      ITHACA_SMOKE_NO_SCOPE_API_KEY: ${{ secrets.ITHACA_SMOKE_NO_SCOPE_API_KEY }}
      ITHACA_ARTIFACT_BUCKET: ${{ vars.ITHACA_ARTIFACT_BUCKET }}
      ITHACA_ARTIFACT_ENDPOINT_URL: ${{ vars.ITHACA_ARTIFACT_ENDPOINT_URL }}
      ITHACA_ARTIFACT_REGION: ${{ vars.ITHACA_ARTIFACT_REGION }}
      ITHACA_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.ITHACA_ARTIFACT_ACCESS_KEY_ID }}
      ITHACA_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.ITHACA_ARTIFACT_SECRET_ACCESS_KEY }}
      IBKR_ENGINE_ENABLED: ${{ vars.IBKR_ENGINE_ENABLED }}
      SHARED_IBKR_NAMESPACE: ${{ vars.SHARED_IBKR_NAMESPACE }}
      ITHACA_IBKR_ENGINE_URL: ${{ vars.ITHACA_IBKR_ENGINE_URL }}
      ITHACA_IBKR_ENGINE_TOKEN: ${{ secrets.ITHACA_IBKR_ENGINE_TOKEN }}
      ITHACA_IBKR_QUOTE_PATH: ${{ vars.ITHACA_IBKR_QUOTE_PATH }}
      ITHACA_IBKR_ACCOUNTS_PATH: ${{ vars.ITHACA_IBKR_ACCOUNTS_PATH }}
      ITHACA_IBKR_POSITIONS_PATH: ${{ vars.ITHACA_IBKR_POSITIONS_PATH }}
      ITHACA_IBKR_ORDERS_PATH: ${{ vars.ITHACA_IBKR_ORDERS_PATH }}
      ITHACA_IBKR_ORDER_PATH: ${{ vars.ITHACA_IBKR_ORDER_PATH }}
      IBKR_SIGNIN_PUBLIC: ${{ vars.IBKR_SIGNIN_PUBLIC }}
      IBKR_SIGNIN_HOST: ${{ vars.IBKR_SIGNIN_HOST }}
      IBKR_SIGNIN_REMOTE_IPS: ${{ vars.IBKR_SIGNIN_REMOTE_IPS }}
      APPLY_CADDY: ${{ vars.APPLY_CADDY }}
      CADDY_APPLY_ENV: ${{ vars.CADDY_APPLY_ENV }}
      CADDY_NAMESPACE: ${{ vars.CADDY_NAMESPACE }}
      ITHACA_LEGACY_ROOT_DOMAIN: ${{ vars.ITHACA_LEGACY_ROOT_DOMAIN }}
      ITHACA_LEGACY_KEY_PREFIX: ${{ vars.ITHACA_LEGACY_KEY_PREFIX }}
      ITHACA_ENABLE_LIVE_EXECUTION: ${{ vars.ITHACA_ENABLE_LIVE_EXECUTION }}
      ITHACA_EXECUTION_KILL_SWITCH: ${{ vars.ITHACA_EXECUTION_KILL_SWITCH }}
      ITHACA_EXECUTION_MAX_NOTIONAL_USD: ${{ vars.ITHACA_EXECUTION_MAX_NOTIONAL_USD }}
      ITHACA_EXECUTION_MAX_QUANTITY: ${{ vars.ITHACA_EXECUTION_MAX_QUANTITY }}
      ITHACA_EXECUTION_MAX_FRESHNESS_MS: ${{ vars.ITHACA_EXECUTION_MAX_FRESHNESS_MS }}
      APP_NODE_WORKLOAD: ${{ vars.APP_NODE_WORKLOAD }}
      WORKER_NODE_WORKLOAD: ${{ vars.WORKER_NODE_WORKLOAD }}
      APP_REPLICAS: ${{ vars.APP_REPLICAS }}
      WORKER_REPLICAS: ${{ vars.WORKER_REPLICAS }}
      BACKTEST_REPLICAS: ${{ vars.BACKTEST_REPLICAS }}
      BACKTEST_MIN_REPLICAS: ${{ vars.BACKTEST_MIN_REPLICAS }}
      BACKTEST_MAX_REPLICAS: ${{ vars.BACKTEST_MAX_REPLICAS }}
      BACKTEST_WORKER_ENABLED: ${{ vars.BACKTEST_WORKER_ENABLED }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Wait for required checks
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/verify_required_workflows.py

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          require_env() { test -n "${!1:-}" || { echo "Missing deployment configuration: $1" >&2; exit 1; }; }
          require_env DIGITALOCEAN_ACCESS_TOKEN
          require_env ITHACA_PLATFORM_DB_URL
          require_env ITHACA_SESSION_SECRET
          require_env CLERK_PUBLISHABLE_KEY
          case "${CLERK_PUBLISHABLE_KEY}" in
            pk_test_*|pk_live_*) ;;
            *) echo "CLERK_PUBLISHABLE_KEY must start with pk_test_ or pk_live_" >&2; exit 1 ;;
          esac
          require_env CLERK_SECRET_KEY
          require_env CLERK_ALLOWED_ORIGINS
          require_env CLERK_ISSUER
          require_env DO_CLUSTER_NAME
          require_env K8S_GATEWAY_NAMESPACE
          require_env K8S_WORKER_NAMESPACE
          require_env APP_HOST
          require_env MCP_HOST
          test -n "${CLERK_PEM_PUBLIC_KEY:-}${CLERK_JWKS_URL:-}" || { echo "Missing Clerk verification key" >&2; exit 1; }
          if [[ "${BACKTEST_WORKER_ENABLED:-0}" == "1" ]]; then
            require_env ITHACA_ARTIFACT_BUCKET
            require_env ITHACA_ARTIFACT_ENDPOINT_URL
            require_env ITHACA_ARTIFACT_ACCESS_KEY_ID
            require_env ITHACA_ARTIFACT_SECRET_ACCESS_KEY
          fi

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415
        with:
          version: v1.33.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Authenticate container registry
        shell: bash
        run: doctl registry login --expiry-seconds 1200

      - name: Build and publish application image
        if: env.DEPLOY_MODE == 'deploy'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: registry.digitalocean.com/${{ env.REGISTRY_NAME }}/ithaca:${{ github.sha }}
          build-args: |
            CLERK_PUBLISHABLE_VALUE=${{ secrets.CLERK_PUBLISHABLE_KEY }}
            VITE_API_BASE=/api

      - name: Connect cluster and apply deployment
        shell: bash
        env:
          ITHACA_EXECUTION_KILL_SWITCH: ${{ vars.ITHACA_EXECUTION_KILL_SWITCH }}
        run: |
          set -euo pipefail
          doctl registry login --expiry-seconds 1200
          doctl kubernetes cluster kubeconfig save "${DO_CLUSTER_NAME}"
          if [[ "${DEPLOY_ENV}" == "prod" ]]; then
            test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          fi
          export WORKER_IMAGE="registry.digitalocean.com/${REGISTRY_NAME}/ithaca:${GITHUB_SHA}"
          export IBKR_ENGINE_IMAGE="registry.digitalocean.com/${REGISTRY_NAME}/ithaca-ibkr-engine:${GITHUB_SHA}"
          if [[ "${DEPLOY_MODE}" == "dry-run" ]]; then
            export DEPLOY_DRY_RUN=client
          fi
          bash deploy/deploy_services.sh

      - name: Verify deployed HTTP endpoints
        if: env.DEPLOY_MODE == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 5 "https://${APP_HOST}/livez"
          curl -fsS --retry 6 --retry-delay 5 "https://${APP_HOST}/healthz"
          curl -fsS --retry 6 --retry-delay 5 "https://${APP_HOST}/readyz"

      - name: Verify customer launch gate
        if: env.DEPLOY_MODE == 'deploy' && env.DEPLOY_ENV == 'prod'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if kubectl -n "${K8S_GATEWAY_NAMESPACE}" exec deploy/ithaca-app -c mcp-gateway -- env \
              ITHACA_API_KEY="${ITHACA_SMOKE_API_KEY}" \
              ITHACA_MCP_NO_SCOPE_API_KEY="${ITHACA_SMOKE_NO_SCOPE_API_KEY}" \
              /opt/venv/bin/python scripts/launch_gate.py --mode http --base-url "https://${APP_HOST}" --mcp-url "https://${MCP_HOST}/mcp" --require-postgres --require-workers-ready --require-mcp --json; then
              exit 0
            fi
            test "${attempt}" -lt 12 || exit 1
            echo "Launch gate is settling after rollout; retrying in 10 seconds (${attempt}/12)."
            sleep 10
          done

      - name: Mark deployed production image as latest
        if: env.DEPLOY_MODE == 'deploy' && env.DEPLOY_ENV == 'prod'
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "registry.digitalocean.com/${REGISTRY_NAME}/ithaca:latest" "registry.digitalocean.com/${REGISTRY_NAME}/ithaca:${GITHUB_SHA}"
          if [[ "${IBKR_ENGINE_ENABLED:-1}" != "0" ]]; then
            docker buildx imagetools create -t "registry.digitalocean.com/${REGISTRY_NAME}/ithaca-ibkr-engine:latest" "registry.digitalocean.com/${REGISTRY_NAME}/ithaca-ibkr-engine:${GITHUB_SHA}"
          fi
