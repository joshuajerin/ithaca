name: greptile-config

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: greptile-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate greptile.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate Greptile configuration
        run: |
          node <<'NODE'
          const fs = require("fs");
          const config = JSON.parse(fs.readFileSync("greptile.json", "utf8"));
          const required = ["triggerOnUpdates", "statusCheck", "includeBranches", "ignorePatterns", "customContext"];
          for (const key of required) {
            if (!(key in config)) throw new Error(`greptile.json is missing ${key}`);
          }
          if (config.triggerOnUpdates !== true) {
            throw new Error("Greptile must review PR updates: triggerOnUpdates must be true");
          }
          if (config.statusCheck !== true) {
            throw new Error("Greptile status checks must stay enabled");
          }
          for (const branch of ["main", "ui"]) {
            if (!config.includeBranches.includes(branch)) {
              throw new Error(`Greptile must include ${branch}`);
            }
          }
          const files = config.customContext?.files ?? [];
          for (const file of ["docs/AGENT_CLIENT_SETUP.md", "docs/GREPTILE_AUTOMATION.md", "scripts/install_agent_mcp.py"]) {
            if (!files.includes(file)) {
              throw new Error(`Greptile customContext.files must include ${file}`);
            }
          }
          console.log("greptile.json OK");
          NODE
