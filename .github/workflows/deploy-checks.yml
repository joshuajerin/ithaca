name: deploy-checks

# Gates for the deploy layer (Stream 2): the production images build, service
# roles smoke-test, and Terraform is fmt-clean + valid. No push, no apply, no
# cloud credentials — these run on every PR to keep the deploy path from rotting.
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-build:
    name: 1/2 • docker image build (no push)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build the multi-service image (CPU-only, no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ithaca:ci
          build-args: |
            CLERK_PUBLISHABLE_VALUE=pk_test_Y2kuZXhhbXBsZS5jb20k
            VITE_API_BASE=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Build the IBKR engine image (CPU-only, no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./Dockerfile.ibkr-engine
          platforms: linux/amd64
          push: false
          load: true
          tags: ithaca-ibkr-engine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Smoke-test the service roles boot
        run: |
          set -euo pipefail
          # imports resolve for every service in the single image
          docker run --rm ithaca:ci shell -c \
            'python -c "import ithaca_core, ithaca_platform, ithaca_runtime, ithaca_rest, ithaca_control, ithaca_mcp; print(\"imports OK\")"'
          # the conductor role starts (prints its banner) then we stop it
          cid="$(docker run -d -e ITHACA_DB=:memory: ithaca:ci conductor)"
          sleep 5
          docker logs "$cid" | grep -q "ithaca conductor up" && echo "conductor role OK"
          docker rm -f "$cid"
          # the trigger-engine role starts and stays alive even before an IBKR URL is configured
          cid="$(docker run -d -e ITHACA_DB=:memory: ithaca:ci trigger-engine)"
          sleep 5
          docker logs "$cid" | grep -q "ithaca trigger engine up" && echo "trigger-engine role OK"
          docker rm -f "$cid"
          docker run --rm ithaca-ibkr-engine:ci python -c \
            'import ithaca_ibkr_engine; print("ibkr engine imports OK")'

  terraform-check:
    name: 2/2 • terraform fmt + validate
    runs-on: self-hosted
    needs: image-build
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.15.6"
      - name: terraform fmt -check (recursive)
        run: terraform fmt -check -recursive
      - name: terraform init (no backend, providers only)
        run: terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform validate -no-color
      - name: CPU-ONLY GUARDRAIL • a GPU node slug must FAIL the plan
        # The variable validation rejects gpu-* before any API call, so this
        # proves the guardrail without a DO token. We assert the plan errors AND
        # that the error names the guardrail.
        run: |
          set -euo pipefail
          if out="$(terraform plan -input=false -var='backtest_node_size=gpu-h100x1-80gb' 2>&1)"; then
            echo "FAIL: plan accepted a GPU node slug"; echo "$out"; exit 1
          fi
          echo "$out" | grep -qi "CPU-ONLY GUARDRAIL" \
            && echo "PASS: GPU node slug rejected by the CPU-ONLY GUARDRAIL"
