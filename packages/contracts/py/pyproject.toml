[project]
name = "ithaca-contracts"
version = "0.0.0"
description = "Ithaca v2 shared contracts (generated pydantic models). Single source of truth: ../schema/*.schema.json"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["jsonschema>=4.21", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ithaca_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
