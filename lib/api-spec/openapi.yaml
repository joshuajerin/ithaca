openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: terminal
    description: Agentic terminal orchestration and skills
  - name: watchlist
    description: Watchlist operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /skills:
    get:
      operationId: getSkills
      tags: [terminal]
      summary: List terminal skills
      description: Returns the catalog of panel skills, each with its descriptive setup and subskills
      responses:
        "200":
          description: Skill catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillCatalog"
  /sectors:
    get:
      operationId: getSectors
      tags: [terminal]
      summary: List sectors
      description: Returns the sectors available in the mock dataset
      responses:
        "200":
          description: Sector list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectorList"
  /suggestions:
    get:
      operationId: getSuggestions
      tags: [terminal]
      summary: Example prompts
      description: Returns example natural-language prompts the user can try
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestionList"
  /dashboard/default:
    get:
      operationId: getDefaultDashboard
      tags: [terminal]
      summary: Default dashboard
      description: Returns a starter dashboard so the terminal is populated on first load
      responses:
        "200":
          description: Dashboard spec
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSpec"
  /orchestrate:
    post:
      operationId: orchestrate
      tags: [terminal]
      summary: Run the agent
      description: Interprets a natural-language query, selects skills, and returns a full dashboard spec with arranged panels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrchestrationRequest"
      responses:
        "200":
          description: Dashboard spec
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSpec"
  /speak:
    post:
      operationId: speak
      tags: [terminal]
      summary: Synthesize narration audio
      description: Converts a short narration string into natural-sounding speech audio (base64-encoded mp3)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeakRequest"
      responses:
        "200":
          description: Synthesized audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeechAudio"
  /refine:
    post:
      operationId: refinePanel
      tags: [terminal]
      summary: Refine a single panel
      description: Updates one panel of an existing dashboard without touching the others
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefineRequest"
      responses:
        "200":
          description: Updated panel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Panel"
  /watchlist:
    get:
      operationId: getWatchlist
      tags: [watchlist]
      summary: Get watchlist
      responses:
        "200":
          description: Watchlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Watchlist"
    post:
      operationId: addToWatchlist
      tags: [watchlist]
      summary: Add a symbol to the watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistInput"
      responses:
        "200":
          description: Updated watchlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Watchlist"
  /watchlist/{symbol}:
    delete:
      operationId: removeFromWatchlist
      tags: [watchlist]
      summary: Remove a symbol from the watchlist
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated watchlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Watchlist"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PanelType:
      type: string
      enum:
        - price_chart
        - news
        - analysis
        - fundamentals
        - screener
        - heatmap
        - sentiment
        - comparison
        - portfolio_risk
        - backtest
        - monte_carlo
        - correlation_matrix
        - factor_analysis
        - order_book
        - trade_flow
        - tca_report
        - macro_dashboard
        - yield_curve
        - bond_rv
        - cds_pricer
        - cashflow_duration
        - iv_surface
        - options_strategy
        - vol_term_structure
        - structured_product
    PanelStatus:
      type: string
      enum:
        - ok
        - loading
        - error
    PanelLayout:
      type: object
      description: Grid placement, 12-column grid. h is in row units.
      required: [x, y, w, h]
      properties:
        x:
          type: integer
        y:
          type: integer
        w:
          type: integer
        h:
          type: integer
    PricePoint:
      type: object
      required: [t, o, h, l, c, v]
      properties:
        t:
          type: string
        o:
          type: number
        h:
          type: number
        l:
          type: number
        c:
          type: number
        v:
          type: number
    PriceChartData:
      type: object
      required: [symbol, name, currency, last, change, changePct, range, points]
      properties:
        symbol:
          type: string
        name:
          type: string
        currency:
          type: string
        last:
          type: number
        change:
          type: number
        changePct:
          type: number
        range:
          type: string
        points:
          type: array
          items:
            $ref: "#/components/schemas/PricePoint"
    NewsItem:
      type: object
      required: [id, headline, source, summary, publishedAt, sentiment, tickers]
      properties:
        id:
          type: string
        headline:
          type: string
        source:
          type: string
        summary:
          type: string
        url:
          type: ["string", "null"]
        publishedAt:
          type: string
        sentiment:
          type: string
          enum: [positive, neutral, negative]
        tickers:
          type: array
          items:
            type: string
    NewsData:
      type: object
      required: [scope, items]
      properties:
        scope:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/NewsItem"
    AnalysisData:
      type: object
      required: [scope, headline, summary, bullets, stance, confidence]
      properties:
        scope:
          type: string
        headline:
          type: string
        summary:
          type: string
        bullets:
          type: array
          items:
            type: string
        stance:
          type: string
          enum: [bullish, neutral, bearish]
        confidence:
          type: number
    FundamentalMetric:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: string
        change:
          type: ["number", "null"]
        hint:
          type: ["string", "null"]
    FundamentalsData:
      type: object
      required: [symbol, name, metrics]
      properties:
        symbol:
          type: string
        name:
          type: string
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/FundamentalMetric"
    ScreenerRow:
      type: object
      required: [symbol, name, price, changePct, marketCap, volume, sector]
      properties:
        symbol:
          type: string
        name:
          type: string
        price:
          type: number
        changePct:
          type: number
        retYTD:
          type: ["number", "null"]
        marketCap:
          type: number
        peRatio:
          type: ["number", "null"]
        volume:
          type: number
        sector:
          type: string
    ScreenerData:
      type: object
      required: [title, rows]
      properties:
        title:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ScreenerRow"
    HeatmapCell:
      type: object
      required: [symbol, name, changePct, marketCap, sector]
      properties:
        symbol:
          type: string
        name:
          type: string
        changePct:
          type: number
        retYTD:
          type: ["number", "null"]
        marketCap:
          type: number
        sector:
          type: string
    HeatmapData:
      type: object
      required: [title, cells]
      properties:
        title:
          type: string
        cells:
          type: array
          items:
            $ref: "#/components/schemas/HeatmapCell"
    SentimentSource:
      type: object
      required: [channel, score, volume, change]
      properties:
        channel:
          type: string
        score:
          type: number
        volume:
          type: integer
        change:
          type: number
    SentimentTrendPoint:
      type: object
      required: [t, score]
      properties:
        t:
          type: string
        score:
          type: number
    SentimentData:
      type: object
      required: [scope, overall, label, sources, trend]
      properties:
        scope:
          type: string
        overall:
          type: number
        label:
          type: string
          enum: [very_bearish, bearish, neutral, bullish, very_bullish]
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SentimentSource"
        trend:
          type: array
          items:
            $ref: "#/components/schemas/SentimentTrendPoint"
    ComparisonValue:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: string
    ComparisonCompany:
      type: object
      required: [symbol, name, values]
      properties:
        symbol:
          type: string
        name:
          type: string
        values:
          type: array
          items:
            $ref: "#/components/schemas/ComparisonValue"
    ComparisonData:
      type: object
      required: [title, metricLabels, companies]
      properties:
        title:
          type: string
        metricLabels:
          type: array
          items:
            type: string
        companies:
          type: array
          items:
            $ref: "#/components/schemas/ComparisonCompany"
    VarBin:
      type: object
      required: [bin, count]
      properties:
        bin:
          type: number
        count:
          type: number
    FactorExposure:
      type: object
      required: [factor, exposure]
      properties:
        factor:
          type: string
        exposure:
          type: number
    RiskSummary:
      type: object
      required: [var95, trackingError, beta, portfolioName]
      properties:
        var95:
          type: number
        trackingError:
          type: number
        beta:
          type: number
        portfolioName:
          type: string
        cvar95:
          type: number
    PortfolioRiskData:
      type: object
      required: [portfolioName, symbols, varHistogram, factorExposures, summary]
      properties:
        portfolioName:
          type: string
        symbols:
          type: array
          items:
            type: string
        varHistogram:
          type: array
          items:
            $ref: "#/components/schemas/VarBin"
        factorExposures:
          type: array
          items:
            $ref: "#/components/schemas/FactorExposure"
        summary:
          $ref: "#/components/schemas/RiskSummary"
    BacktestPoint:
      type: object
      required: [t, strategy, benchmark]
      properties:
        t:
          type: string
        strategy:
          type: number
        benchmark:
          type: number
    DrawdownPoint:
      type: object
      required: [t, dd]
      properties:
        t:
          type: string
        dd:
          type: number
    BacktestStats:
      type: object
      required: [sharpe, sortino, cagr, maxDD, winRate]
      properties:
        sharpe:
          type: number
        sortino:
          type: number
        cagr:
          type: number
        maxDD:
          type: number
        winRate:
          type: number
        totalReturn:
          type: number
        vol:
          type: number
        turnover:
          type: number
        var95:
          type: number
        cvar95:
          type: number
    TradeLogEntry:
      type: object
      required: [t, action, price, fromPos, toPos]
      properties:
        t:
          type: string
        action:
          type: string
        price:
          type: number
        fromPos:
          type: number
        toPos:
          type: number
    BacktestData:
      type: object
      required: [symbol, strategy, curve, drawdown, stats]
      properties:
        symbol:
          type: string
        strategy:
          type: string
        curve:
          type: array
          items:
            $ref: "#/components/schemas/BacktestPoint"
        drawdown:
          type: array
          items:
            $ref: "#/components/schemas/DrawdownPoint"
        stats:
          $ref: "#/components/schemas/BacktestStats"
        tradeLog:
          type: array
          items:
            $ref: "#/components/schemas/TradeLogEntry"
    MonteCarloFanPoint:
      type: object
      required: [step, p5, p25, p50, p75, p95]
      properties:
        step:
          type: integer
        p5:
          type: number
        p25:
          type: number
        p50:
          type: number
        p75:
          type: number
        p95:
          type: number
    MonteCarloPath:
      type: object
      required: [id, values]
      properties:
        id:
          type: integer
        values:
          type: array
          items:
            type: number
    MonteCarloSummary:
      type: object
      required: [method, startValue, horizon, paths, expectedTerminal, medianTerminal, p5Terminal, p95Terminal, expectedReturn, probLoss, var95, cvar95]
      properties:
        method:
          type: string
        startValue:
          type: number
        horizon:
          type: integer
        paths:
          type: integer
        expectedTerminal:
          type: number
        medianTerminal:
          type: number
        p5Terminal:
          type: number
        p95Terminal:
          type: number
        expectedReturn:
          type: number
        probLoss:
          type: number
        var95:
          type: number
        cvar95:
          type: number
    MonteCarloData:
      type: object
      required: [symbol, method, horizon, startValue, fan, samplePaths, summary]
      properties:
        symbol:
          type: string
        method:
          type: string
        horizon:
          type: integer
        startValue:
          type: number
        fan:
          type: array
          items:
            $ref: "#/components/schemas/MonteCarloFanPoint"
        samplePaths:
          type: array
          items:
            $ref: "#/components/schemas/MonteCarloPath"
        summary:
          $ref: "#/components/schemas/MonteCarloSummary"
    BetaRow:
      type: object
      required: [symbol, beta, hedgeRatio]
      properties:
        symbol:
          type: string
        beta:
          type: number
        hedgeRatio:
          type: number
    CorrelationMatrixData:
      type: object
      required: [symbols, matrix, window, betas]
      properties:
        symbols:
          type: array
          items:
            type: string
        matrix:
          type: array
          items:
            type: array
            items:
              type: number
        window:
          type: integer
        betas:
          type: array
          items:
            $ref: "#/components/schemas/BetaRow"
    MonthlyAttribution:
      type: object
      required: [month, momentum, value, size, quality, residual]
      properties:
        month:
          type: string
        momentum:
          type: number
        value:
          type: number
        size:
          type: number
        quality:
          type: number
        residual:
          type: number
    FactorLoading:
      type: object
      required: [factor, loading, tStat, contribution]
      properties:
        factor:
          type: string
        loading:
          type: number
        tStat:
          type: number
        contribution:
          type: number
    FactorAnalysisData:
      type: object
      required: [symbol, name, monthlyAttribution, loadings]
      properties:
        symbol:
          type: string
        name:
          type: string
        monthlyAttribution:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyAttribution"
        loadings:
          type: array
          items:
            $ref: "#/components/schemas/FactorLoading"
    PanelData:
      oneOf:
        - $ref: "#/components/schemas/PriceChartData"
        - $ref: "#/components/schemas/NewsData"
        - $ref: "#/components/schemas/AnalysisData"
        - $ref: "#/components/schemas/FundamentalsData"
        - $ref: "#/components/schemas/ScreenerData"
        - $ref: "#/components/schemas/HeatmapData"
        - $ref: "#/components/schemas/SentimentData"
        - $ref: "#/components/schemas/ComparisonData"
        - $ref: "#/components/schemas/PortfolioRiskData"
        - $ref: "#/components/schemas/BacktestData"
        - $ref: "#/components/schemas/MonteCarloData"
        - $ref: "#/components/schemas/CorrelationMatrixData"
        - $ref: "#/components/schemas/FactorAnalysisData"
    Panel:
      type: object
      required: [id, type, title, layout, status]
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/PanelType"
        title:
          type: string
        layout:
          $ref: "#/components/schemas/PanelLayout"
        status:
          $ref: "#/components/schemas/PanelStatus"
        note:
          type: ["string", "null"]
        asOf:
          type: ["string", "null"]
          description: ISO timestamp of the freshest underlying data, when known.
        source:
          type: ["string", "null"]
          description: Data provenance for this panel ("live" or "mock").
        data:
          $ref: "#/components/schemas/PanelData"
    NarrationSegment:
      type: object
      description: A spoken narration chunk, optionally tied to a panel to highlight while it is read.
      required: [text]
      properties:
        text:
          type: string
        panelId:
          type: ["string", "null"]
    DashboardSpec:
      type: object
      required: [sessionId, summary, panels]
      properties:
        sessionId:
          type: string
        summary:
          type: string
        panels:
          type: array
          items:
            $ref: "#/components/schemas/Panel"
        narration:
          type: ["array", "null"]
          description: Ordered spoken narration segments for voice mode; null/omitted for text requests.
          items:
            $ref: "#/components/schemas/NarrationSegment"
    OrchestrationRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        sessionId:
          type: ["string", "null"]
        voice:
          type: ["boolean", "null"]
          description: When true, the agent also returns spoken narration segments.
    SpeakRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
        voice:
          type: ["string", "null"]
          description: Optional named voice for synthesis.
    SpeechAudio:
      type: object
      required: [audio, format]
      properties:
        audio:
          type: string
          description: Base64-encoded audio data.
        format:
          type: string
          description: Audio container/codec, e.g. mp3.
    RefineRequest:
      type: object
      required: [sessionId, panelId, instruction]
      properties:
        sessionId:
          type: string
        panelId:
          type: string
        instruction:
          type: string
    Subskill:
      type: object
      required: [name, description, expectedOutput]
      properties:
        name:
          type: string
        description:
          type: string
        expectedOutput:
          type: string
    Skill:
      type: object
      required: [id, name, panelType, description, subskills]
      properties:
        id:
          type: string
        name:
          type: string
        panelType:
          $ref: "#/components/schemas/PanelType"
        description:
          type: string
        subskills:
          type: array
          items:
            $ref: "#/components/schemas/Subskill"
    SkillCatalog:
      type: object
      required: [skills]
      properties:
        skills:
          type: array
          items:
            $ref: "#/components/schemas/Skill"
    Sector:
      type: object
      required: [id, name, tickerCount]
      properties:
        id:
          type: string
        name:
          type: string
        tickerCount:
          type: integer
    SectorList:
      type: object
      required: [sectors]
      properties:
        sectors:
          type: array
          items:
            $ref: "#/components/schemas/Sector"
    SuggestionList:
      type: object
      required: [prompts]
      properties:
        prompts:
          type: array
          items:
            type: string
    WatchlistItem:
      type: object
      required: [symbol, name, price, changePct]
      properties:
        symbol:
          type: string
        name:
          type: string
        price:
          type: number
        changePct:
          type: number
    Watchlist:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WatchlistItem"
    WatchlistInput:
      type: object
      required: [symbol]
      properties:
        symbol:
          type: string
