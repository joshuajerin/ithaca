openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: terminal
    description: Agentic terminal orchestration and skills
  - name: auth
    description: Authentication, firms and roles
  - name: watchlist
    description: Watchlist operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create a firm and its first admin user
      description: Registers a new firm (tenant) and its first user as admin, then starts an authenticated session via an httpOnly cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "200":
          description: Authenticated identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthIdentity"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      description: Verifies credentials and starts an authenticated session via an httpOnly cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthIdentity"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      description: Invalidates the current session and clears the session cookie.
      responses:
        "200":
          description: Logout result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResult"
  /auth/user:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current authenticated user
      description: Returns the current user, firm and role. Responds 401 when not authenticated.
      responses:
        "200":
          description: Authenticated identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthIdentity"
        "401":
          description: Not authenticated
  /skills:
    get:
      operationId: getSkills
      tags: [terminal]
      summary: List terminal skills
      description: Returns the catalog of panel skills, each with its descriptive setup and subskills
      responses:
        "200":
          description: Skill catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillCatalog"
  /sectors:
    get:
      operationId: getSectors
      tags: [terminal]
      summary: List sectors
      description: Returns the sectors available in the mock dataset
      responses:
        "200":
          description: Sector list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectorList"
  /suggestions:
    get:
      operationId: getSuggestions
      tags: [terminal]
      summary: Example prompts
      description: Returns example natural-language prompts the user can try
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestionList"
  /dashboard/default:
    get:
      operationId: getDefaultDashboard
      tags: [terminal]
      summary: Default dashboard
      description: Returns a starter dashboard so the terminal is populated on first load
      responses:
        "200":
          description: Dashboard spec
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSpec"
  /orchestrate:
    post:
      operationId: orchestrate
      tags: [terminal]
      summary: Run the agent
      description: Interprets a natural-language query, selects skills, and returns a full dashboard spec with arranged panels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrchestrationRequest"
      responses:
        "200":
          description: Dashboard spec
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSpec"
  /dashboards:
    get:
      operationId: listSavedDashboards
      tags: [terminal]
      summary: List saved dashboards
      description: Returns metadata for every saved (named) dashboard layout, newest first.
      responses:
        "200":
          description: Saved dashboard list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedDashboardList"
    post:
      operationId: saveDashboard
      tags: [terminal]
      summary: Save the current dashboard
      description: Persists the supplied panels under a name so they can be restored later. Saving an existing name overwrites that layout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDashboardRequest"
      responses:
        "200":
          description: Saved dashboard metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedDashboardMeta"
  /dashboards/{dashboardId}:
    get:
      operationId: restoreDashboard
      tags: [terminal]
      summary: Restore a saved dashboard
      description: Loads a saved dashboard into a fresh session and returns its full spec.
      parameters:
        - name: dashboardId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Restored dashboard spec
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSpec"
    delete:
      operationId: deleteSavedDashboard
      tags: [terminal]
      summary: Delete a saved dashboard
      parameters:
        - name: dashboardId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated saved dashboard list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedDashboardList"
  /speak:
    post:
      operationId: speak
      tags: [terminal]
      summary: Synthesize narration audio
      description: Converts a short narration string into natural-sounding speech audio (base64-encoded mp3)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeakRequest"
      responses:
        "200":
          description: Synthesized audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeechAudio"
  /transcribe:
    post:
      operationId: transcribe
      tags: [terminal]
      summary: Transcribe recorded mic audio
      description: Converts a base64-encoded recorded audio clip into text, for browsers without the Web Speech API (Safari/Firefox).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscribeRequest"
      responses:
        "200":
          description: Recognized text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcription"
  /navigate:
    post:
      operationId: navigate
      tags: [terminal]
      summary: Plan an AI navigator tour
      description: Returns an ordered tour of the panels currently on a session's dashboard, each with a short caption, for the AI cursor to walk the user through.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NavigateRequest"
      responses:
        "200":
          description: Navigation tour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationTour"
  /refine:
    post:
      operationId: refinePanel
      tags: [terminal]
      summary: Refine a single panel
      description: Updates one panel of an existing dashboard without touching the others
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefineRequest"
      responses:
        "200":
          description: Updated panel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Panel"
  /scenario/recompute:
    post:
      operationId: recomputeScenario
      tags: [terminal]
      summary: Re-run a what-if scenario projection
      description: Re-projects a what-if scenario against the same real price history with tweaked assumptions (horizon and overall drift), without re-parsing the natural-language prompt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioRecomputeRequest"
      responses:
        "200":
          description: Recomputed scenario projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioRecomputeResult"
  /watchlist:
    get:
      operationId: getWatchlist
      tags: [watchlist]
      summary: Get watchlist
      responses:
        "200":
          description: Watchlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Watchlist"
    post:
      operationId: addToWatchlist
      tags: [watchlist]
      summary: Add a symbol to the watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistInput"
      responses:
        "200":
          description: Updated watchlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Watchlist"
  /watchlist/{symbol}:
    delete:
      operationId: removeFromWatchlist
      tags: [watchlist]
      summary: Remove a symbol from the watchlist
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated watchlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Watchlist"
components:
  schemas:
    SignupRequest:
      type: object
      properties:
        firmName:
          type: string
        name:
          type: string
        email:
          type: string
        password:
          type: string
      required:
        - firmName
        - name
        - email
        - password
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    AuthUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
      required:
        - id
        - name
        - email
        - role
    AuthFirm:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
    AuthIdentity:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        firm:
          $ref: "#/components/schemas/AuthFirm"
        permissions:
          type: array
          items:
            type: string
      required:
        - user
        - firm
        - permissions
    LogoutResult:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PanelType:
      type: string
      enum:
        - price_chart
        - news
        - analysis
        - fundamentals
        - screener
        - heatmap
        - sentiment
        - comparison
        - portfolio_risk
        - backtest
        - monte_carlo
        - correlation_matrix
        - factor_analysis
        - risk_model
        - factor_exposures
        - order_book
        - trade_flow
        - tca_report
        - macro_dashboard
        - yield_curve
        - sovereign_compare
        - bond_rv
        - cds_pricer
        - cashflow_duration
        - iv_surface
        - options_strategy
        - vol_term_structure
        - structured_product
        - signal_research
        - signal_scorecard
    PanelStatus:
      type: string
      enum:
        - ok
        - loading
        - error
    PanelLayout:
      type: object
      description: Grid placement, 12-column grid. h is in row units.
      required: [x, y, w, h]
      properties:
        x:
          type: integer
        y:
          type: integer
        w:
          type: integer
        h:
          type: integer
    PricePoint:
      type: object
      required: [t, o, h, l, c, v]
      properties:
        t:
          type: string
        o:
          type: number
        h:
          type: number
        l:
          type: number
        c:
          type: number
        v:
          type: number
    PriceChartData:
      type: object
      required: [symbol, name, currency, last, change, changePct, range, points]
      properties:
        symbol:
          type: string
        name:
          type: string
        currency:
          type: string
        last:
          type: ["number", "null"]
        change:
          type: ["number", "null"]
        changePct:
          type: ["number", "null"]
        range:
          type: string
        ranges:
          type: array
          items:
            type: string
        points:
          type: array
          items:
            $ref: "#/components/schemas/PricePoint"
        available:
          type: boolean
        reason:
          type: ["string", "null"]
        pending:
          type: boolean
    NewsItem:
      type: object
      required: [id, headline, source, summary, publishedAt, sentiment, tickers]
      properties:
        id:
          type: string
        headline:
          type: string
        source:
          type: string
        summary:
          type: string
        url:
          type: ["string", "null"]
        publishedAt:
          type: string
        sentiment:
          type: string
          enum: [positive, neutral, negative]
        tickers:
          type: array
          items:
            type: string
    NewsData:
      type: object
      required: [scope, items]
      properties:
        scope:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/NewsItem"
    AnalysisData:
      type: object
      required: [scope, headline, summary, bullets, stance, confidence]
      properties:
        scope:
          type: string
        headline:
          type: string
        summary:
          type: string
        bullets:
          type: array
          items:
            type: string
        stance:
          type: string
          enum: [bullish, neutral, bearish]
        confidence:
          type: number
    FundamentalMetric:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: string
        change:
          type: ["number", "null"]
        hint:
          type: ["string", "null"]
    FundamentalsData:
      type: object
      required: [symbol, name, metrics]
      properties:
        symbol:
          type: string
        name:
          type: string
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/FundamentalMetric"
    ScreenerRow:
      type: object
      required: [symbol, name, price, changePct, marketCap, volume, sector]
      properties:
        symbol:
          type: string
        name:
          type: string
        price:
          type: number
        changePct:
          type: number
        ret1Y:
          type: ["number", "null"]
        marketCap:
          type: number
        peRatio:
          type: ["number", "null"]
        volume:
          type: number
        sector:
          type: string
        subIndustry:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
    ScreenerData:
      type: object
      required: [title, rows]
      properties:
        title:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ScreenerRow"
    HeatmapCell:
      type: object
      required: [symbol, name, changePct, marketCap, sector]
      properties:
        symbol:
          type: string
        name:
          type: string
        changePct:
          type: number
        ret1Y:
          type: ["number", "null"]
        marketCap:
          type: number
        sector:
          type: string
        subIndustry:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
    HeatmapData:
      type: object
      required: [title, cells]
      properties:
        title:
          type: string
        cells:
          type: array
          items:
            $ref: "#/components/schemas/HeatmapCell"
    SentimentSource:
      type: object
      required: [channel, score, volume, change]
      properties:
        channel:
          type: string
        score:
          type: number
        volume:
          type: integer
        change:
          type: number
    SentimentTrendPoint:
      type: object
      required: [t, score]
      properties:
        t:
          type: string
        score:
          type: number
    SentimentData:
      type: object
      required: [scope, overall, label, sources, trend]
      properties:
        scope:
          type: string
        overall:
          type: number
        label:
          type: string
          enum: [very_bearish, bearish, neutral, bullish, very_bullish]
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SentimentSource"
        trend:
          type: array
          items:
            $ref: "#/components/schemas/SentimentTrendPoint"
    ComparisonValue:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: string
    ComparisonCompany:
      type: object
      required: [symbol, name, values]
      properties:
        symbol:
          type: string
        name:
          type: string
        values:
          type: array
          items:
            $ref: "#/components/schemas/ComparisonValue"
    ComparisonData:
      type: object
      required: [title, metricLabels, companies]
      properties:
        title:
          type: string
        metricLabels:
          type: array
          items:
            type: string
        companies:
          type: array
          items:
            $ref: "#/components/schemas/ComparisonCompany"
    VarBin:
      type: object
      required: [bin, count]
      properties:
        bin:
          type: number
        count:
          type: number
    FactorExposure:
      type: object
      required: [factor, exposure]
      properties:
        factor:
          type: string
        exposure:
          type: number
    RiskSummary:
      type: object
      required: [var95, trackingError, beta, portfolioName]
      properties:
        var95:
          type: number
        trackingError:
          type: number
        beta:
          type: number
        portfolioName:
          type: string
        cvar95:
          type: number
    PortfolioRiskData:
      type: object
      required: [portfolioName, symbols, varHistogram, factorExposures, summary]
      properties:
        portfolioName:
          type: string
        symbols:
          type: array
          items:
            type: string
        varHistogram:
          type: array
          items:
            $ref: "#/components/schemas/VarBin"
        factorExposures:
          type: array
          items:
            $ref: "#/components/schemas/FactorExposure"
        summary:
          $ref: "#/components/schemas/RiskSummary"
    BacktestPoint:
      type: object
      required: [t, strategy, benchmark]
      properties:
        t:
          type: string
        strategy:
          type: number
        benchmark:
          type: number
    DrawdownPoint:
      type: object
      required: [t, dd]
      properties:
        t:
          type: string
        dd:
          type: number
    BacktestStats:
      type: object
      required: [sharpe, sortino, cagr, maxDD, winRate]
      properties:
        sharpe:
          type: number
        sortino:
          type: number
        cagr:
          type: number
        maxDD:
          type: number
        winRate:
          type: number
        totalReturn:
          type: number
        vol:
          type: number
        turnover:
          type: number
        var95:
          type: number
        cvar95:
          type: number
    TradeLogEntry:
      type: object
      required: [t, action, price, fromPos, toPos]
      properties:
        t:
          type: string
        action:
          type: string
        price:
          type: number
        fromPos:
          type: number
        toPos:
          type: number
        pnl:
          type: number
          description: Realized P&L on the portion closed by this trade, in points on the rebased capital base.
        pnlPct:
          type: number
          description: Percent return on the closed leg of this trade.
    BacktestData:
      type: object
      required: [symbol, strategy, curve, drawdown, stats]
      properties:
        symbol:
          type: string
        strategy:
          type: string
        params:
          type: ["object", "null"]
          additionalProperties: true
          description: >-
            Effective tunable strategy parameters used for this run (defaults
            filled in), e.g. {lookback: 90} for momentum or {lookback: 20,
            threshold: 1.0} for mean reversion. Drives the in-panel parameter
            controls.
        range:
          type: string
          description: Lookback window used for the backtest, e.g. 1M, 3M, 6M, 1Y.
        curve:
          type: array
          items:
            $ref: "#/components/schemas/BacktestPoint"
        drawdown:
          type: array
          items:
            $ref: "#/components/schemas/DrawdownPoint"
        stats:
          $ref: "#/components/schemas/BacktestStats"
        tradeLog:
          type: array
          items:
            $ref: "#/components/schemas/TradeLogEntry"
        investment:
          type: number
          description: Dollar lump sum invested at entry; the equity curve is denominated in these dollars.
        entry:
          $ref: "#/components/schemas/BacktestEntry"
        endValue:
          type: number
          description: Ending dollar value of the invested amount under the strategy.
        benchmarkEndValue:
          type: number
          description: Ending dollar value of the same amount under buy-and-hold benchmark.
        gain:
          type: number
          description: Ending value minus invested amount, in dollars.
        gainPct:
          type: number
          description: Total return over the held period, in percent.
        multiple:
          type: number
          description: Ending value divided by invested amount (e.g. 3.5 = 3.5x).
        entryNote:
          type: string
          description: Honest note when the requested entry could not be fully honored.
    BacktestEntry:
      type: object
      properties:
        mode:
          type: string
          description: Entry mode actually used (peak, date, range, preset).
        date:
          type: string
          description: ISO date of the bar where the money went in.
        price:
          type: number
          description: Close price at entry.
        label:
          type: string
          description: Human-readable entry label.
    MonteCarloFanPoint:
      type: object
      required: [step, p5, p25, p50, p75, p95]
      properties:
        step:
          type: integer
        p5:
          type: number
        p25:
          type: number
        p50:
          type: number
        p75:
          type: number
        p95:
          type: number
    MonteCarloPath:
      type: object
      required: [id, values]
      properties:
        id:
          type: integer
        values:
          type: array
          items:
            type: number
    MonteCarloSummary:
      type: object
      required: [method, startValue, horizon, paths, expectedTerminal, medianTerminal, p5Terminal, p95Terminal, expectedReturn, probLoss, var95, cvar95]
      properties:
        method:
          type: string
        startValue:
          type: number
        horizon:
          type: integer
        paths:
          type: integer
        expectedTerminal:
          type: number
        medianTerminal:
          type: number
        p5Terminal:
          type: number
        p95Terminal:
          type: number
        expectedReturn:
          type: number
        probLoss:
          type: number
        var95:
          type: number
        cvar95:
          type: number
    MonteCarloData:
      type: object
      required: [symbol, method, horizon, startValue, fan, samplePaths, summary]
      properties:
        symbol:
          type: string
        method:
          type: string
        horizon:
          type: integer
        startValue:
          type: number
        fan:
          type: array
          items:
            $ref: "#/components/schemas/MonteCarloFanPoint"
        samplePaths:
          type: array
          items:
            $ref: "#/components/schemas/MonteCarloPath"
        summary:
          $ref: "#/components/schemas/MonteCarloSummary"
    BetaRow:
      type: object
      required: [symbol, beta, hedgeRatio]
      properties:
        symbol:
          type: string
        beta:
          type: number
        hedgeRatio:
          type: number
    CorrelationMatrixData:
      type: object
      required: [symbols, matrix, window, betas]
      properties:
        symbols:
          type: array
          items:
            type: string
        matrix:
          type: array
          items:
            type: array
            items:
              type: number
        window:
          type: integer
        betas:
          type: array
          items:
            $ref: "#/components/schemas/BetaRow"
    MonthlyAttribution:
      type: object
      required: [month, momentum, value, size, quality, residual]
      properties:
        month:
          type: string
        momentum:
          type: number
        value:
          type: number
        size:
          type: number
        quality:
          type: number
