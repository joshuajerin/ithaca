    Panel:
      type: object
      required: [id, type, title, layout, status]
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/PanelType"
        title:
          type: string
        layout:
          $ref: "#/components/schemas/PanelLayout"
        status:
          $ref: "#/components/schemas/PanelStatus"
        note:
          type: ["string", "null"]
        asOf:
          type: ["string", "null"]
          description: ISO timestamp of the freshest underlying data, when known.
        source:
          type: ["string", "null"]
          description: Data provenance for this panel ("live" or "mock").
        data:
          $ref: "#/components/schemas/PanelData"
    NarrationSegment:
      type: object
      description: A spoken narration chunk, optionally tied to a panel to highlight while it is read.
      required: [text]
      properties:
        text:
          type: string
        panelId:
          type: ["string", "null"]
    DashboardSpec:
      type: object
      required: [sessionId, summary, panels]
      properties:
        sessionId:
          type: string
        summary:
          type: string
        panels:
          type: array
          items:
            $ref: "#/components/schemas/Panel"
        narration:
          type: ["array", "null"]
          description: Ordered spoken narration segments for voice mode; null/omitted for text requests.
          items:
            $ref: "#/components/schemas/NarrationSegment"
        intent:
          type: ["string", "null"]
          description: '"question" when the message was answered conversationally (panels unchanged) or "build" when the dashboard was composed/modified.'
        answer:
          type: ["string", "null"]
          description: Conversational answer text for a question intent; null/omitted for a build.
        degraded:
          type: ["boolean", "null"]
          description: True when the dashboard/narration fell back to the keyword heuristic because the AI was slow or unavailable (rather than AI-composed).
        note:
          type: ["string", "null"]
          description: Short human-readable notice explaining a degraded/fallback response (e.g. AI was slow); null/omitted for normal AI responses.
    OrchestrationRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        sessionId:
          type: ["string", "null"]
        voice:
          type: ["boolean", "null"]
          description: When true, the agent also returns spoken narration segments.
    SaveDashboardRequest:
      type: object
      required: [name, panels]
      properties:
        name:
          type: string
        summary:
          type: ["string", "null"]
        panels:
          type: array
          items:
            $ref: "#/components/schemas/Panel"
    SavedDashboardMeta:
      type: object
      required: [id, name, summary, panelCount]
      properties:
        id:
          type: string
        name:
          type: string
        summary:
          type: string
        panelCount:
          type: integer
        createdAt:
          type: ["string", "null"]
        updatedAt:
          type: ["string", "null"]
    SavedDashboardList:
      type: object
      required: [dashboards]
      properties:
        dashboards:
          type: array
          items:
            $ref: "#/components/schemas/SavedDashboardMeta"
    SpeakRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
        voice:
          type: ["string", "null"]
          description: Optional named voice for synthesis.
        speed:
          type: ["number", "null"]
          description: Optional speaking-rate multiplier (1.0 = normal pace). Clamped server-side to a sane range.
    SpeechAudio:
      type: object
      required: [audio, format]
      properties:
        audio:
          type: string
          description: Base64-encoded audio data.
        format:
          type: string
          description: Audio container/codec, e.g. mp3.
    TranscribeRequest:
      type: object
      required: [audio]
      properties:
        audio:
          type: string
          description: Base64-encoded recorded audio clip.
        mimeType:
          type: ["string", "null"]
          description: MIME type of the recorded clip, e.g. audio/webm or audio/mp4.
    Transcription:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: Recognized text from the audio (may be empty).
    RefineRequest:
      type: object
      required: [sessionId, panelId]
      properties:
        sessionId:
          type: string
        panelId:
          type: string
        instruction:
          type: string
        params:
          type: ["object", "null"]
          additionalProperties: true
          description: >-
            Optional explicit skill parameters. When provided, they are applied
            directly (bypassing instruction parsing), enabling deterministic
            in-panel controls such as switching a backtest's strategy/range, a
            correlation window, or swapping tickers without re-issuing a command.
    ScenarioRecomputeRequest:
      type: object
      required: [symbols, horizonDays, driftPct]
      properties:
        symbols:
          type: array
          items:
            type: string
          description: The scenario's underlying symbols to project against (real price history).
        horizonDays:
          type: integer
          description: Projection horizon in trading days (clamped 21-1260).
        driftPct:
          type: number
          description: Incremental annualized drift to layer on the baseline (clamped -60 to 60).
        amount:
          type: number
          description: Dollar amount invested; baseline/scenario terminal values are denominated in these dollars.
    ScenarioRecomputeResult:
      type: object
      required: [symbols, horizonDays, driftPct]
      properties:
        projection:
          type: ["object", "null"]
          additionalProperties: true
          description: The recomputed baseline-vs-scenario projection (same shape the scenario panel renders).
        source:
          type: ["string", "null"]
        asOf:
          type: ["string", "null"]
        symbols:
          type: array
          items:
            type: string
        horizonDays:
          type: integer
        driftPct:
          type: number
    NavigateRequest:
      type: object
      required: [sessionId]
      properties:
        sessionId:
          type: string
        query:
          type: ["string", "null"]
          description: Optional natural-language request guiding what the tour should emphasize.
    NavigationStop:
      type: object
      description: One stop on the navigator tour, tying a panel to a short on-screen caption.
