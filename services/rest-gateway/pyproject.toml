[project]
name = "ithaca-rest-gateway"
version = "0.0.0"
description = "REST + SSE gateway feeding the web UI from the shared core + trace store."
requires-python = ">=3.11"
dependencies = [
    "ithaca-core",
    "ithaca-contracts",
    "ithaca-platform",
    "ithaca-control-plane",
    "ithaca-runtime",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ithaca-mcp-gateway"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ithaca_rest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
ithaca-core = { workspace = true }
ithaca-contracts = { workspace = true }
ithaca-platform = { workspace = true }
ithaca-control-plane = { workspace = true }
ithaca-runtime = { workspace = true }
ithaca-mcp-gateway = { workspace = true }
