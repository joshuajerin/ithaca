[project]
name = "doomberg-rest-gateway"
version = "0.0.0"
description = "REST + SSE gateway feeding the web UI from the shared core + trace store."
requires-python = ">=3.11"
dependencies = [
    "doomberg-core",
    "doomberg-contracts",
    "doomberg-platform",
    "doomberg-control-plane",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doomberg_rest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
doomberg-core = { workspace = true }
doomberg-contracts = { workspace = true }
doomberg-platform = { workspace = true }
doomberg-control-plane = { workspace = true }
