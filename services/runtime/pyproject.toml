[project]
name = "ithaca-runtime"
version = "0.0.0"
description = "DO workers: backtest_runner + live_runner. Out-of-process; imports ithaca-core."
requires-python = ">=3.11"
dependencies = ["ithaca-core[databento]", "ithaca-contracts", "ithaca-platform", "boto3>=1.35"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ithaca_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
ithaca-core = { workspace = true }
ithaca-contracts = { workspace = true }
ithaca-platform = { workspace = true }
