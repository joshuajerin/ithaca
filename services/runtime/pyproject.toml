[project]
name = "doomberg-runtime"
version = "0.0.0"
description = "DO workers: backtest_runner + live_runner. Out-of-process; imports doomberg-core."
requires-python = ">=3.11"
dependencies = ["doomberg-core", "doomberg-contracts", "doomberg-platform", "boto3>=1.35"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doomberg_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
doomberg-core = { workspace = true }
doomberg-contracts = { workspace = true }
doomberg-platform = { workspace = true }
