[project]
name = "ithaca-mcp-gateway"
version = "0.0.0"
description = "Ithaca v2 MCP gateway — the primary product surface. Exposes the Data Layer as MCP tools the BYO agent calls, emitting a trace event per call."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.7",
    "ithaca-core",
    "ithaca-contracts",
    "ithaca-platform",
    "ithaca-control-plane",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ithaca_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
ithaca-core = { workspace = true }
ithaca-contracts = { workspace = true }
ithaca-platform = { workspace = true }
ithaca-control-plane = { workspace = true }
