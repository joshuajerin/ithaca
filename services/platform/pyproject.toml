[project]
name = "doomberg-platform"
version = "0.0.0"
description = "Local system-of-record (SQLite): trace events, runs, strategies + pub/sub for SSE."
requires-python = ">=3.11"
dependencies = ["doomberg-core", "doomberg-contracts"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doomberg_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
doomberg-core = { workspace = true }
doomberg-contracts = { workspace = true }
