[project]
name = "ithaca-platform"
version = "0.0.0"
description = "Platform system-of-record: traces, runs, strategies, jobs, auth, and governance stores over SQLite local or Postgres production."
requires-python = ">=3.11"
dependencies = ["ithaca-core", "ithaca-contracts", "psycopg[binary,pool]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ithaca_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
ithaca-core = { workspace = true }
ithaca-contracts = { workspace = true }
