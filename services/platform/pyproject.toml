[project]
name = "doomberg-platform"
version = "0.0.0"
description = "Platform system-of-record: traces, runs, strategies, jobs, auth, and governance stores over SQLite local or Postgres production."
requires-python = ">=3.11"
dependencies = ["doomberg-core", "doomberg-contracts", "psycopg[binary,pool]>=3.2", "pyjwt[crypto]>=2.10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doomberg_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
doomberg-core = { workspace = true }
doomberg-contracts = { workspace = true }
