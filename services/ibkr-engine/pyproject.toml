[project]
name = "doomberg-ibkr-engine"
version = "0.0.0"
description = "Doomberg-owned IBKR Client Portal Gateway wrapper for realtime quotes and broker read models."
requires-python = ">=3.11"
dependencies = [
    "doomberg-core",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doomberg_ibkr_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
doomberg-core = { workspace = true }
