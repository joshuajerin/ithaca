[project]
name = "doomberg-archive"
version = "0.0.0"
description = "The v1 market-data archive: canonical schema, bulk loader, and read gateway over Postgres schema `archive` (read-only reference data for the data-layer skills)."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doomberg_archive"]

[tool.hatch.build.targets.wheel.force-include]
"src/doomberg_archive/schema.sql" = "doomberg_archive/schema.sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
