[project]
name = "doomberg-control-plane"
version = "0.0.0"
description = "Control plane: specs, run state machine, compliance gate. SINGLE writer of the money path."
requires-python = ">=3.11"
dependencies = [
    "doomberg-core",
    "doomberg-contracts",
    "doomberg-platform",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doomberg_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
doomberg-core = { workspace = true }
doomberg-contracts = { workspace = true }
doomberg-platform = { workspace = true }
