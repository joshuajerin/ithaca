[project]
name = "doomberg-core"
version = "0.0.0"
description = "The one shared Doomberg v2 core: ported quant engine + data sources + registry/graph/accounting/risk/gateway. Imported (never re-ported) by every service."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "httpx>=0.28",
    "doomberg-contracts",
    "requests>=2.32",
    "yfinance>=0.2",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doomberg_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
doomberg-contracts = { workspace = true }
