# Default-deny the worker namespace, then allow only the runtime egress workers
# need: DNS, same-env gateway calls, managed Postgres, and HTTPS/HTTP provider
# traffic for connected broker/data engines.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ${K8S_WORKER_NAMESPACE}
  labels:
    doomberg/environment: ${DOOMBERG_ENV}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-runtime-dependencies
  namespace: ${K8S_WORKER_NAMESPACE}
  labels:
    doomberg/environment: ${DOOMBERG_ENV}
spec:
  podSelector:
    matchLabels:
      doomberg/component: worker
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              doomberg/role: data-gateway
              doomberg/environment: ${DOOMBERG_ENV}
          podSelector:
            matchLabels:
              doomberg/component: app
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8001
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 25060
