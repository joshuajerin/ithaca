# Default-deny worker namespace egress, with the single allowed destination set
# to this environment's data-gateway namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ${K8S_WORKER_NAMESPACE}
  labels:
    doomberg/environment: ${DOOMBERG_ENV}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-data-gateway
  namespace: ${K8S_WORKER_NAMESPACE}
  labels:
    doomberg/environment: ${DOOMBERG_ENV}
spec:
  podSelector:
    matchLabels:
      doomberg/component: worker
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              doomberg/role: data-gateway
              doomberg/environment: ${DOOMBERG_ENV}
          podSelector:
            matchLabels:
              doomberg/component: app
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
