# NodePort Service for the always-on app pod. The Terraform Load Balancer
# (loadbalancer.tf) forwards:
#   LB :80   → NodePort 30080 → rest-gateway :8000   (healthcheck /healthz on 30080)
#   LB :8080 → NodePort 30808 → mcp-gateway  :8080   (hosted MCP for remote agents)
# The control-plane (:8001) is intentionally NOT exposed publicly — the rest-gateway
# invokes its money-path actions in-process, and admin (key minting) is done via
# kubectl exec/port-forward. The LB targets every node via the k8s:<cluster-id> tag.
apiVersion: v1
kind: Service
metadata:
  name: doomberg-app
  namespace: ${K8S_GATEWAY_NAMESPACE}
  labels:
    doomberg/component: app
    doomberg/environment: ${DOOMBERG_ENV}
spec:
  type: NodePort
  # Streamable HTTP associates each MCP session with an in-process transport.
  # Keep follow-up requests on the pod that created the session; otherwise a
  # second app replica returns "session expired" / 404 for a valid session id.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  selector:
    doomberg/component: app
  ports:
    - name: rest
      port: 8000
      targetPort: 8000
      nodePort: ${REST_NODE_PORT}
      protocol: TCP
    - name: mcp
      port: 8080
      targetPort: 8080
      nodePort: ${MCP_NODE_PORT}
      protocol: TCP
