# Always-on app pod: rest-gateway + control-plane + mcp-gateway.
#
# The active worker loops live in worker-deployment.yaml. This deployment is the
# stateless ingress/control surface over the managed Postgres platform store
# (DOOMBERG_DB from doomberg-db.platform_url), so it does not mount a shared
# SQLite PVC and can be scaled separately from compute workers.
# ${WORKER_IMAGE} is substituted by deploy_services.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doomberg-app
  namespace: ${K8S_GATEWAY_NAMESPACE}
  labels:
    doomberg/component: app
    doomberg/environment: ${DOOMBERG_ENV}
spec:
  replicas: ${APP_REPLICAS}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: ${APP_MAX_SURGE}
      maxUnavailable: ${APP_MAX_UNAVAILABLE}
  selector:
    matchLabels:
      doomberg/component: app
  template:
    metadata:
      labels:
        doomberg/component: app
        doomberg/environment: ${DOOMBERG_ENV}
        # Mark this pod as the same-env data-gateway target for worker egress.
        doomberg/role: data-gateway
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload: ${APP_NODE_WORKLOAD}
      tolerations:
        - key: workload
          operator: Equal
          value: ${APP_NODE_WORKLOAD}
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    doomberg/component: app
                    doomberg/environment: ${DOOMBERG_ENV}
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Apply the platform system-of-record schema before API/MCP containers
        # start. open_db() is idempotent too, but this gives rollout failures a
        # clear init-container surface.
        - name: platform-migrate
          image: ${WORKER_IMAGE}
          imagePullPolicy: IfNotPresent
          args: ["platform-migrate"]
          env:
            - name: DOOMBERG_ENV
              value: "${DOOMBERG_ENV}"
            - name: DOOMBERG_DB
              valueFrom:
                secretKeyRef:
                  name: doomberg-db
                  key: platform_url
          resources:
            requests: { cpu: "100m", memory: 128Mi }
            limits: { cpu: "500m", memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
        # Apply any new archive.* DDL before the app containers start.
        # Uses IF NOT EXISTS throughout so it's safe to re-run on every pod start.
        - name: archive-migrate
          image: ${WORKER_IMAGE}
          imagePullPolicy: IfNotPresent
          args: ["archive-migrate"]
          env:
            - name: DOOMBERG_ENV
              value: "${DOOMBERG_ENV}"
            - name: DOOMBERG_ARCHIVE_URL
              valueFrom:
                secretKeyRef:
                  name: doomberg-db
                  key: archive_url
          resources:
            requests: { cpu: "100m", memory: 128Mi }
            limits: { cpu: "500m", memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        # --- rest-gateway: the UI/REST backend (LB entry :80 → NodePort 30080) ---
        - name: rest-gateway
          image: ${WORKER_IMAGE}
          imagePullPolicy: IfNotPresent
          args: ["rest-gateway"]
          ports:
            - name: rest
              containerPort: 8000
          env:
            - name: DOOMBERG_ENV
              value: "${DOOMBERG_ENV}"
            - name: DOOMBERG_DB
              valueFrom:
                secretKeyRef:
                  name: doomberg-db
                  key: platform_url
            - name: DOOMBERG_ARCHIVE_URL
              valueFrom:
                secretKeyRef:
                  name: doomberg-db
                  key: archive_url
            - name: DOOMBERG_REST_PORT
              value: "8000"
            - name: DOOMBERG_SESSION_SECRET
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: session_secret, optional: true }
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: google_client_id, optional: true }
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: google_client_secret, optional: true }
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: github_client_id, optional: true }
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: github_client_secret, optional: true }
            - name: FMP_API_KEY
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: fmp_api_key, optional: true }
            - name: DOOMBERG_ENABLE_LIVE_EXECUTION
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: enable_live_execution, optional: true }
            - name: DOOMBERG_EXECUTION_MAX_NOTIONAL_USD
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: execution_max_notional_usd, optional: true }
            - name: DOOMBERG_EXECUTION_MAX_QUANTITY
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: execution_max_quantity, optional: true }
            - name: DOOMBERG_EXECUTION_MAX_FRESHNESS_MS
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: execution_max_freshness_ms, optional: true }
            - name: DOOMBERG_IBKR_ENGINE_URL
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_engine_url, optional: true }
            - name: DOOMBERG_IBKR_ENGINE_TOKEN
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_engine_token, optional: true }
            - name: DOOMBERG_IBKR_QUOTE_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_quote_path, optional: true }
            - name: DOOMBERG_IBKR_HISTORY_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_history_path, optional: true }
            - name: DOOMBERG_IBKR_NEWS_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_news_path, optional: true }
            - name: DOOMBERG_IBKR_SCANNER_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_scanner_path, optional: true }
            - name: DOOMBERG_IBKR_ORDER_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_order_path, optional: true }
            - name: DOOMBERG_IBKR_ACCOUNTS_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_accounts_path, optional: true }
            - name: DOOMBERG_IBKR_POSITIONS_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_positions_path, optional: true }
            - name: DOOMBERG_IBKR_ORDERS_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_orders_path, optional: true }
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "200m", memory: 320Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
        # --- control-plane: the money-path writer (LB entry :8080 → NodePort 30808) ---
        - name: control-plane
          image: ${WORKER_IMAGE}
          imagePullPolicy: IfNotPresent
          args: ["control-plane"]
          ports:
            - name: control
              containerPort: 8001
          env:
            - name: DOOMBERG_ENV
              value: "${DOOMBERG_ENV}"
            - name: DOOMBERG_DB
              valueFrom:
                secretKeyRef:
                  name: doomberg-db
                  key: platform_url
            - name: DOOMBERG_ARCHIVE_URL
              valueFrom:
                secretKeyRef:
                  name: doomberg-db
                  key: archive_url
            - name: DOOMBERG_CONTROL_PORT
              value: "8001"
            - name: DOOMBERG_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: admin_token, optional: true }
            - name: DOOMBERG_ENABLE_LIVE_EXECUTION
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: enable_live_execution, optional: true }
            - name: DOOMBERG_EXECUTION_MAX_NOTIONAL_USD
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: execution_max_notional_usd, optional: true }
            - name: DOOMBERG_EXECUTION_MAX_QUANTITY
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: execution_max_quantity, optional: true }
            - name: DOOMBERG_EXECUTION_MAX_FRESHNESS_MS
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: execution_max_freshness_ms, optional: true }
            - name: DOOMBERG_IBKR_ENGINE_URL
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_engine_url, optional: true }
            - name: DOOMBERG_IBKR_ENGINE_TOKEN
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_engine_token, optional: true }
            - name: DOOMBERG_IBKR_QUOTE_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_quote_path, optional: true }
            - name: DOOMBERG_IBKR_HISTORY_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_history_path, optional: true }
            - name: DOOMBERG_IBKR_NEWS_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_news_path, optional: true }
            - name: DOOMBERG_IBKR_SCANNER_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_scanner_path, optional: true }
            - name: DOOMBERG_IBKR_ORDER_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_order_path, optional: true }
            - name: DOOMBERG_IBKR_ACCOUNTS_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_accounts_path, optional: true }
            - name: DOOMBERG_IBKR_POSITIONS_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_positions_path, optional: true }
            - name: DOOMBERG_IBKR_ORDERS_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_orders_path, optional: true }
          readinessProbe:
            httpGet: { path: /healthz, port: 8001 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "200m", memory: 320Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
        # --- mcp-gateway (HTTP): the hosted MCP endpoint for remote BYO agents.
        # Co-located with the control plane for the initial deploy shape. Auth/API keys are
        # shared through Postgres; Streamable-HTTP lives at POST /mcp.
        # LB :8080 → NodePort 30808 → this container :8080. ---
        - name: mcp-gateway
          image: ${WORKER_IMAGE}
          imagePullPolicy: IfNotPresent
          args: ["mcp-gateway"]
          ports:
            - name: mcp
              containerPort: 8080
          env:
            - name: DOOMBERG_ENV
              value: "${DOOMBERG_ENV}"
            - name: DOOMBERG_MCP_TRANSPORT
              value: http
            - name: DOOMBERG_MCP_PORT
              value: "8080"
            - name: DOOMBERG_MCP_ALLOWED_HOSTS
              value: "${MCP_ALLOWED_HOSTS}"
            - name: DOOMBERG_DB
              valueFrom:
                secretKeyRef:
                  name: doomberg-db
                  key: platform_url
            - name: DOOMBERG_ARCHIVE_URL
              valueFrom:
                secretKeyRef:
                  name: doomberg-db
                  key: archive_url
            - name: FMP_API_KEY
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: fmp_api_key, optional: true }
            - name: DOOMBERG_ENABLE_LIVE_EXECUTION
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: enable_live_execution, optional: true }
            - name: DOOMBERG_EXECUTION_MAX_NOTIONAL_USD
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: execution_max_notional_usd, optional: true }
            - name: DOOMBERG_EXECUTION_MAX_QUANTITY
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: execution_max_quantity, optional: true }
            - name: DOOMBERG_EXECUTION_MAX_FRESHNESS_MS
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: execution_max_freshness_ms, optional: true }
            - name: DOOMBERG_IBKR_ENGINE_URL
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_engine_url, optional: true }
            - name: DOOMBERG_IBKR_ENGINE_TOKEN
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_engine_token, optional: true }
            - name: DOOMBERG_IBKR_QUOTE_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_quote_path, optional: true }
            - name: DOOMBERG_IBKR_HISTORY_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_history_path, optional: true }
            - name: DOOMBERG_IBKR_NEWS_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_news_path, optional: true }
            - name: DOOMBERG_IBKR_SCANNER_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_scanner_path, optional: true }
            - name: DOOMBERG_IBKR_ORDER_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_order_path, optional: true }
            - name: DOOMBERG_IBKR_ACCOUNTS_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_accounts_path, optional: true }
            - name: DOOMBERG_IBKR_POSITIONS_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_positions_path, optional: true }
            - name: DOOMBERG_IBKR_ORDERS_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_orders_path, optional: true }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "150m", memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
