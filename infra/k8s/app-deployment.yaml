# Always-on app pod: rest-gateway + control-plane + mcp-gateway.
#
# The active worker loops live in worker-deployment.yaml. This deployment is the
# stateless ingress/control surface over the managed Postgres platform store
# (ITHACA_DB from ithaca-db.platform_url), so it does not mount a shared
# SQLite PVC and can be scaled separately from compute workers.
# ${WORKER_IMAGE} is substituted by deploy_services.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ithaca-app
  namespace: ${K8S_GATEWAY_NAMESPACE}
  labels:
    ithaca/component: app
    ithaca/environment: ${ITHACA_ENV}
spec:
  replicas: ${APP_REPLICAS}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: ${APP_MAX_SURGE}
      maxUnavailable: ${APP_MAX_UNAVAILABLE}
  selector:
    matchLabels:
      ithaca/component: app
  template:
    metadata:
      labels:
        ithaca/component: app
        ithaca/environment: ${ITHACA_ENV}
        # Mark this pod as the same-env data-gateway target for worker egress.
        ithaca/role: data-gateway
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload: ${APP_NODE_WORKLOAD}
      tolerations:
        - key: workload
          operator: Equal
          value: ${APP_NODE_WORKLOAD}
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    ithaca/component: app
                    ithaca/environment: ${ITHACA_ENV}
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Apply the platform system-of-record schema before API/MCP containers
        # start. open_db() is idempotent too, but this gives rollout failures a
        # clear init-container surface.
        - name: platform-migrate
          image: ${WORKER_IMAGE}
          imagePullPolicy: IfNotPresent
          args: ["platform-migrate"]
          env:
            - name: ITHACA_ENV
              value: "${ITHACA_ENV}"
            - name: ITHACA_DB
              valueFrom:
                secretKeyRef:
                  name: ithaca-db
                  key: platform_url
            - name: ITHACA_DB_MIGRATION_MODE
              value: "apply"
            - name: ITHACA_DB_ALLOW_FORWARD_MIGRATIONS
              value: "${ITHACA_DB_ALLOW_FORWARD_MIGRATIONS}"
          resources:
            requests: { cpu: "100m", memory: 128Mi }
            limits: { cpu: "500m", memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        # --- rest-gateway: the UI/REST backend (LB entry :80 → NodePort 30080) ---
        - name: rest-gateway
          image: ${WORKER_IMAGE}
          imagePullPolicy: IfNotPresent
          args: ["rest-gateway"]
          ports:
            - name: rest
              containerPort: 8000
          env:
            - name: ITHACA_ENV
              value: "${ITHACA_ENV}"
            - name: ITHACA_DB
              valueFrom:
                secretKeyRef:
                  name: ithaca-db
                  key: platform_url
            - name: ITHACA_DB_MIGRATION_MODE
              value: "validate"
            - name: ITHACA_DB_ALLOW_FORWARD_MIGRATIONS
              value: "${ITHACA_DB_ALLOW_FORWARD_MIGRATIONS}"
            - name: ITHACA_REST_PORT
              value: "8000"
            - name: ITHACA_SESSION_SECRET
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: session_secret, optional: true }
            - name: ITHACA_LEGACY_KEY_PREFIX
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: legacy_key_prefix, optional: true }
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: clerk_secret_key }
            - name: CLERK_PEM_PUBLIC_KEY
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: clerk_pem_public_key, optional: true }
            - name: CLERK_JWKS_URL
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: clerk_jwks_url, optional: true }
            - name: CLERK_ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: clerk_allowed_origins, optional: true }
            - name: CLERK_ISSUER
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: clerk_issuer, optional: true }
            - name: FMP_API_KEY
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: fmp_api_key, optional: true }
            - name: DATABENTO_API_KEY
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: databento_api_key, optional: true }
            - name: DATABENTO_DATASET
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: databento_dataset, optional: true }
            - name: ITHACA_DATA_SOURCE
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: data_source, optional: true }
            - name: ITHACA_ARTIFACT_BUCKET
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: artifact_bucket, optional: true }
            - name: ITHACA_ARTIFACT_ENDPOINT_URL
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: artifact_endpoint_url, optional: true }
            - name: ITHACA_ARTIFACT_REGION
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: artifact_region, optional: true }
            - name: ITHACA_ARTIFACT_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: artifact_access_key_id, optional: true }
            - name: ITHACA_ARTIFACT_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: artifact_secret_access_key, optional: true }
            - name: ITHACA_ENABLE_LIVE_EXECUTION
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: enable_live_execution, optional: true }
            - name: ITHACA_EXECUTION_KILL_SWITCH
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: execution_kill_switch, optional: true }
            - name: ITHACA_EXECUTION_MAX_NOTIONAL_USD
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: execution_max_notional_usd, optional: true }
            - name: ITHACA_EXECUTION_MAX_QUANTITY
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: execution_max_quantity, optional: true }
            - name: ITHACA_EXECUTION_MAX_FRESHNESS_MS
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: execution_max_freshness_ms, optional: true }
            - name: ITHACA_IBKR_ENGINE_URL
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_engine_url, optional: true }
            - name: ITHACA_IBKR_ENGINE_TOKEN
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_engine_token, optional: true }
            - name: ITHACA_IBKR_QUOTE_PATH
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_quote_path, optional: true }
            - name: ITHACA_IBKR_HISTORY_PATH
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_history_path, optional: true }
            - name: ITHACA_IBKR_NEWS_PATH
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_news_path, optional: true }
            - name: ITHACA_IBKR_SCANNER_PATH
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_scanner_path, optional: true }
            - name: ITHACA_IBKR_ORDER_PATH
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_order_path, optional: true }
            - name: ITHACA_IBKR_ACCOUNTS_PATH
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_accounts_path, optional: true }
            - name: ITHACA_IBKR_POSITIONS_PATH
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_positions_path, optional: true }
            - name: ITHACA_IBKR_ORDERS_PATH
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_orders_path, optional: true }
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "200m", memory: 320Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
        # --- control-plane: the money-path writer (LB entry :8080 → NodePort 30808) ---
        - name: control-plane
          image: ${WORKER_IMAGE}
          imagePullPolicy: IfNotPresent
          args: ["control-plane"]
          ports:
            - name: control
              containerPort: 8001
          env:
            - name: ITHACA_ENV
              value: "${ITHACA_ENV}"
            - name: ITHACA_DB
              valueFrom:
                secretKeyRef:
                  name: ithaca-db
                  key: platform_url
            - name: ITHACA_DB_MIGRATION_MODE
              value: "validate"
            - name: ITHACA_DB_ALLOW_FORWARD_MIGRATIONS
              value: "${ITHACA_DB_ALLOW_FORWARD_MIGRATIONS}"
            - name: ITHACA_CONTROL_PORT
              value: "8001"
            - name: ITHACA_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: admin_token, optional: true }
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: clerk_secret_key }
            - name: ITHACA_ENABLE_LIVE_EXECUTION
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: enable_live_execution, optional: true }
            - name: ITHACA_EXECUTION_KILL_SWITCH
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: execution_kill_switch, optional: true }
            - name: ITHACA_EXECUTION_MAX_NOTIONAL_USD
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: execution_max_notional_usd, optional: true }
            - name: ITHACA_EXECUTION_MAX_QUANTITY
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: execution_max_quantity, optional: true }
            - name: ITHACA_EXECUTION_MAX_FRESHNESS_MS
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: execution_max_freshness_ms, optional: true }
            - name: ITHACA_IBKR_ENGINE_URL
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_engine_url, optional: true }
            - name: ITHACA_IBKR_ENGINE_TOKEN
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_engine_token, optional: true }
            - name: ITHACA_IBKR_QUOTE_PATH
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_quote_path, optional: true }
            - name: ITHACA_IBKR_HISTORY_PATH
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_history_path, optional: true }
            - name: ITHACA_IBKR_NEWS_PATH
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_news_path, optional: true }
            - name: ITHACA_IBKR_SCANNER_PATH
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_scanner_path, optional: true }
            - name: ITHACA_IBKR_ORDER_PATH
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_order_path, optional: true }
            - name: ITHACA_IBKR_ACCOUNTS_PATH
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_accounts_path, optional: true }
            - name: ITHACA_IBKR_POSITIONS_PATH
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_positions_path, optional: true }
            - name: ITHACA_IBKR_ORDERS_PATH
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_orders_path, optional: true }
          readinessProbe:
            httpGet: { path: /healthz, port: 8001 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "200m", memory: 320Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
        # --- mcp-gateway (HTTP): the hosted MCP endpoint for remote BYO agents.
        # Co-located with the control plane for the initial deploy shape. Auth/API keys are
        # shared through Postgres; Streamable-HTTP lives at POST /mcp.
        # LB :8080 → NodePort 30808 → this container :8080. ---
        - name: mcp-gateway
          image: ${WORKER_IMAGE}
          imagePullPolicy: IfNotPresent
          args: ["mcp-gateway"]
          ports:
            - name: mcp
              containerPort: 8080
          env:
            - name: ITHACA_ENV
              value: "${ITHACA_ENV}"
            - name: ITHACA_MCP_TRANSPORT
              value: http
            - name: ITHACA_MCP_PORT
              value: "8080"
            - name: ITHACA_MCP_ALLOWED_HOSTS
              value: "${MCP_ALLOWED_HOSTS}"
            - name: ITHACA_LEGACY_KEY_PREFIX
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: legacy_key_prefix, optional: true }
            - name: ITHACA_DB
              valueFrom:
                secretKeyRef:
                  name: ithaca-db
                  key: platform_url
            - name: ITHACA_DB_MIGRATION_MODE
              value: "validate"
            - name: ITHACA_DB_ALLOW_FORWARD_MIGRATIONS
              value: "${ITHACA_DB_ALLOW_FORWARD_MIGRATIONS}"
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: clerk_secret_key }
            - name: FMP_API_KEY
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: fmp_api_key, optional: true }
            - name: DATABENTO_API_KEY
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: databento_api_key, optional: true }
            - name: DATABENTO_DATASET
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: databento_dataset, optional: true }
            - name: ITHACA_DATA_SOURCE
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: data_source, optional: true }
            - name: ITHACA_ENABLE_LIVE_EXECUTION
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: enable_live_execution, optional: true }
            - name: ITHACA_EXECUTION_KILL_SWITCH
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: execution_kill_switch, optional: true }
            - name: ITHACA_EXECUTION_MAX_NOTIONAL_USD
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: execution_max_notional_usd, optional: true }
            - name: ITHACA_EXECUTION_MAX_QUANTITY
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: execution_max_quantity, optional: true }
            - name: ITHACA_EXECUTION_MAX_FRESHNESS_MS
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: execution_max_freshness_ms, optional: true }
            - name: ITHACA_IBKR_ENGINE_URL
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_engine_url, optional: true }
            - name: ITHACA_IBKR_ENGINE_TOKEN
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_engine_token, optional: true }
            - name: ITHACA_IBKR_QUOTE_PATH
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_quote_path, optional: true }
            - name: ITHACA_IBKR_HISTORY_PATH
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_history_path, optional: true }
            - name: ITHACA_IBKR_NEWS_PATH
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_news_path, optional: true }
            - name: ITHACA_IBKR_SCANNER_PATH
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_scanner_path, optional: true }
            - name: ITHACA_IBKR_ORDER_PATH
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_order_path, optional: true }
            - name: ITHACA_IBKR_ACCOUNTS_PATH
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_accounts_path, optional: true }
            - name: ITHACA_IBKR_POSITIONS_PATH
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_positions_path, optional: true }
            - name: ITHACA_IBKR_ORDERS_PATH
              valueFrom:
                secretKeyRef: { name: ithaca-db, key: ibkr_orders_path, optional: true }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "150m", memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
