# Weekly CronJob: populate archive.short_interest from yfinance.
# Runs Sunday 02:00 UTC. Upserts data for the full tracked universe (~155 symbols).
# Suspend to pause; set to false to resume.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: short-loader
  namespace: doomberg-gateway
  labels:
    doomberg/component: short-loader
spec:
  schedule: "0 2 * * 0"   # Sunday 02:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800   # 30 min hard cap
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          nodeSelector:
            workload: paper
          tolerations:
            - key: workload
              operator: Equal
              value: paper
              effect: NoSchedule
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: tmp
              emptyDir: {}
          containers:
            - name: short-loader
              image: ${WORKER_IMAGE}
              imagePullPolicy: IfNotPresent
              args: ["archive-load-short"]
              env:
                - name: DOOMBERG_ARCHIVE_URL
                  valueFrom:
                    secretKeyRef:
                      name: doomberg-db
                      key: archive_url
              resources:
                requests: { cpu: "200m", memory: 512Mi }
                limits: { cpu: "1", memory: 1Gi }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities: { drop: ["ALL"] }
