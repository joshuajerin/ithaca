# Always-on worker pod: conductor + trigger-engine.
#
# This deployment owns active loops and has no ingress. It shares the managed
# Postgres platform store with the app deployment, so API/MCP processes can be
# rolled and scaled independently from queue polling, paper ticks, and trigger
# evaluation. Multiple replicas are safe: backtest/trigger jobs use durable job
# leases, while paper scheduling and trigger polling use platform worker_leases
# so only one replica runs each active singleton loop at a time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doomberg-workers
  namespace: ${K8S_WORKER_NAMESPACE}
  labels:
    doomberg/component: worker
    doomberg/environment: ${DOOMBERG_ENV}
spec:
  replicas: ${WORKER_REPLICAS}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: ${WORKER_MAX_SURGE}
      maxUnavailable: ${WORKER_MAX_UNAVAILABLE}
  selector:
    matchLabels:
      doomberg/component: worker
      doomberg/worker-role: active-runtime
  template:
    metadata:
      labels:
        doomberg/component: worker
        doomberg/worker-role: active-runtime
        doomberg/environment: ${DOOMBERG_ENV}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload: ${WORKER_NODE_WORKLOAD}
      tolerations:
        - key: workload
          operator: Equal
          value: ${WORKER_NODE_WORKLOAD}
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    doomberg/component: worker
                    doomberg/environment: ${DOOMBERG_ENV}
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: platform-migrate
          image: ${WORKER_IMAGE}
          imagePullPolicy: IfNotPresent
          args: ["platform-migrate"]
          env:
            - name: DOOMBERG_ENV
              value: "${DOOMBERG_ENV}"
            - name: DOOMBERG_DB
              valueFrom:
                secretKeyRef:
                  name: doomberg-db
                  key: platform_url
          resources:
            requests: { cpu: "100m", memory: 128Mi }
            limits: { cpu: "500m", memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        # --- conductor: backtest worker + trigger job worker + notification dispatcher + paper scheduler.
        - name: conductor
          image: ${WORKER_IMAGE}
          imagePullPolicy: IfNotPresent
          args: ["conductor"]
          env:
            - name: DOOMBERG_ENV
              value: "${DOOMBERG_ENV}"
            - name: DOOMBERG_DB
              valueFrom:
                secretKeyRef:
                  name: doomberg-db
                  key: platform_url
            - name: DOOMBERG_BACKTEST_INTERVAL_S
              value: "2"
            - name: DOOMBERG_ENABLE_BACKTEST_LOOP
              value: "0"
            - name: DOOMBERG_TRIGGER_JOB_INTERVAL_S
              value: "2"
            - name: DOOMBERG_NOTIFICATION_INTERVAL_S
              value: "2"
            - name: DOOMBERG_PAPER_INTERVAL_S
              value: "60"
            - name: DOOMBERG_PAPER_LEASE_TTL_S
              value: "180"
            - name: DOOMBERG_ADAPTIVE_DASHBOARD_INTERVAL_S
              value: "60"
            - name: DOOMBERG_ADAPTIVE_DASHBOARD_PROVIDER
              valueFrom:
                secretKeyRef: { name: doomberg-adaptive-dashboard, key: provider }
            - name: DOOMBERG_ADAPTIVE_DASHBOARD_OPENAI_BASE_URL
              valueFrom:
                secretKeyRef: { name: doomberg-adaptive-dashboard, key: openai_base_url, optional: true }
            - name: DOOMBERG_ADAPTIVE_DASHBOARD_API_KEY
              valueFrom:
                secretKeyRef: { name: doomberg-adaptive-dashboard, key: api_key, optional: true }
            - name: DOOMBERG_ADAPTIVE_DASHBOARD_MODAL_KEY
              valueFrom:
                secretKeyRef: { name: doomberg-adaptive-dashboard, key: modal_key, optional: true }
            - name: DOOMBERG_ADAPTIVE_DASHBOARD_MODAL_SECRET
              valueFrom:
                secretKeyRef: { name: doomberg-adaptive-dashboard, key: modal_secret, optional: true }
            - name: DOOMBERG_ADAPTIVE_DASHBOARD_MODEL
              valueFrom:
                secretKeyRef: { name: doomberg-adaptive-dashboard, key: model }
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: doomberg-adaptive-dashboard, key: anthropic_api_key, optional: true }
            - name: FMP_API_KEY
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: fmp_api_key, optional: true }
            - name: DATABENTO_API_KEY
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: databento_api_key, optional: true }
            - name: DATABENTO_DATASET
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: databento_dataset, optional: true }
            - name: DOOMBERG_DATA_SOURCE
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: data_source, optional: true }
          resources:
            requests: { cpu: "200m", memory: 320Mi }
            limits: { cpu: "2", memory: 2Gi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
        # --- trigger-engine: polls active trigger policies and creates durable runs.
        # Uses a user-connected IBKR engine as a connected-account live-data source.
        # It never submits broker orders directly.
        - name: trigger-engine
          image: ${WORKER_IMAGE}
          imagePullPolicy: IfNotPresent
          args: ["trigger-engine"]
          env:
            - name: DOOMBERG_ENV
              value: "${DOOMBERG_ENV}"
            - name: DOOMBERG_DB
              valueFrom:
                secretKeyRef:
                  name: doomberg-db
                  key: platform_url
            - name: DOOMBERG_TRIGGER_INTERVAL_S
              value: "5"
            - name: DOOMBERG_TRIGGER_LEASE_TTL_S
              value: "60"
            - name: DOOMBERG_IBKR_ENGINE_URL
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_engine_url, optional: true }
            - name: DOOMBERG_IBKR_ENGINE_TOKEN
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_engine_token, optional: true }
            - name: DOOMBERG_IBKR_QUOTE_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_quote_path, optional: true }
            - name: DOOMBERG_IBKR_HISTORY_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_history_path, optional: true }
            - name: DOOMBERG_IBKR_NEWS_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_news_path, optional: true }
            - name: DOOMBERG_IBKR_SCANNER_PATH
              valueFrom:
                secretKeyRef: { name: doomberg-db, key: ibkr_scanner_path, optional: true }
          resources:
            requests: { cpu: "100m", memory: 192Mi }
            limits: { cpu: "500m", memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
