# Caddy — automatic HTTPS reverse proxy for the public tradeithaca.com endpoints.
#
# Why Caddy: it obtains + auto-renews Let's Encrypt certs with zero config (ACME
# HTTP-01 on :80 / TLS-ALPN-01 on :443) and routes by Host. It fronts the in-cluster
# ithaca-app Service (rest :8000, mcp :8080). A dedicated DO LoadBalancer Service
# gives it a public IP; point the tradeithaca.com subdomains at that IP and TLS issues
# automatically once DNS resolves. Lives in ithaca-gateway (unrestricted egress,
# so it can reach the ACME API).
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
  namespace: ithaca-gateway
data:
  Caddyfile: |
    {
      # Non-privileged internal ports (pod runs unprivileged); the LoadBalancer maps
      # public :80 -> 8080 and :443 -> 8443, so ACME still sees the canonical ports.
      http_port 8080
      https_port 8443
      email admin@tradeithaca.com
    }

    # Production MCP endpoint for remote BYO agents: https://mcp.tradeithaca.com/mcp
    mcp.tradeithaca.com {
      reverse_proxy ithaca-app.ithaca-gateway.svc.cluster.local:8080 {
        # MCP streamable-HTTP is long-lived SSE; don't buffer or cut it short.
        flush_interval -1
        transport http {
          read_timeout 1h
          write_timeout 1h
        }
      }
    }

    # The UI / REST API: https://app.tradeithaca.com
    app.tradeithaca.com {
      reverse_proxy ithaca-app.ithaca-gateway.svc.cluster.local:8000
    }

    # Temporary compatibility hosts. The legacy root is injected at deploy time
    # and removed after the announced migration window.
    ${ITHACA_LEGACY_ROOT_DOMAIN}, www.${ITHACA_LEGACY_ROOT_DOMAIN} {
      redir https://tradeithaca.com{uri} permanent
    }

    app.${ITHACA_LEGACY_ROOT_DOMAIN} {
      redir https://app.tradeithaca.com{uri} permanent
    }

    ibkr.${ITHACA_LEGACY_ROOT_DOMAIN} {
      redir https://ibkr.tradeithaca.com{uri} permanent
    }

    mcp.${ITHACA_LEGACY_ROOT_DOMAIN} {
      reverse_proxy ithaca-app.ithaca-gateway.svc.cluster.local:8080 {
        flush_interval -1
        transport http {
          read_timeout 1h
          write_timeout 1h
        }
      }
    }

    # Dev: latest non-main branch.
    dev-mcp.tradeithaca.com, dev-mcp.129.212.135.120.sslip.io {
      reverse_proxy ithaca-app.ithaca-dev-gateway.svc.cluster.local:8080 {
        flush_interval -1
        transport http {
          read_timeout 1h
          write_timeout 1h
        }
      }
    }

    dev-app.tradeithaca.com, dev-app.129.212.135.120.sslip.io {
      reverse_proxy ithaca-app.ithaca-dev-gateway.svc.cluster.local:8000
    }

    dev-app.${ITHACA_LEGACY_ROOT_DOMAIN} {
      redir https://dev-app.tradeithaca.com{uri} permanent
    }

    dev-mcp.${ITHACA_LEGACY_ROOT_DOMAIN} {
      redir https://dev-mcp.tradeithaca.com{uri} permanent
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
  namespace: ithaca-gateway
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: do-block-storage
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: ithaca-gateway
  labels:
    ithaca/component: caddy
spec:
  replicas: 1
  strategy:
    type: Recreate # single writer on the cert volume (RWO)
  selector:
    matchLabels:
      ithaca/component: caddy
  template:
    metadata:
      labels:
        ithaca/component: caddy
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload: paper
      securityContext:
        fsGroup: 1000
      volumes:
        - name: config
          configMap:
            name: caddy-config
        - name: data
          persistentVolumeClaim:
            claimName: caddy-data
        - name: xdg-config
          emptyDir: {}
      containers:
        - name: caddy
          image: caddy:2.10
          args: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
          ports:
            - { name: http, containerPort: 8080 }
            - { name: https, containerPort: 8443 }
          env:
            - { name: XDG_DATA_HOME, value: /data }
            - { name: XDG_CONFIG_HOME, value: /config }
          volumeMounts:
            - { name: config, mountPath: /etc/caddy }
            - { name: data, mountPath: /data }
            - { name: xdg-config, mountPath: /config }
          resources:
            requests: { cpu: "50m", memory: 96Mi }
            limits: { cpu: "500m", memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: caddy
  namespace: ithaca-gateway
  labels:
    ithaca/component: caddy
  annotations:
    # TCP passthrough: Caddy terminates TLS itself (so ACME TLS-ALPN works).
    service.beta.kubernetes.io/do-loadbalancer-protocol: "tcp"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-protocol: "tcp"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-port: "8080"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    ithaca/component: caddy
  ports:
    - { name: http, port: 80, targetPort: 8080, protocol: TCP }
    - { name: https, port: 443, targetPort: 8443, protocol: TCP }
