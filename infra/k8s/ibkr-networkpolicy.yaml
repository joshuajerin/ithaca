apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ibkr-engine-ingress-egress
  namespace: ${K8S_GATEWAY_NAMESPACE}
  labels:
    ithaca/component: ibkr-engine
    ithaca/environment: ${ITHACA_ENV}
spec:
  podSelector:
    matchLabels:
      ithaca/component: ibkr-engine
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # Ithaca app/MCP/control-plane may call the normalized wrapper API.
    - from:
        - podSelector:
            matchLabels:
              ithaca/component: app
      ports:
        - protocol: TCP
          port: ${IBKR_ENGINE_PORT}
    # Worker trigger smokes and trigger-engine may call the normalized wrapper API.
    - from:
        - namespaceSelector:
            matchLabels:
              ithaca/role: workers
              ithaca/environment: ${ITHACA_ENV}
          podSelector:
            matchLabels:
              ithaca/component: worker
      ports:
        - protocol: TCP
          port: ${IBKR_ENGINE_PORT}
    # Dev uses the single shared customer-authenticated IBKR engine in the prod
    # gateway namespace. Do not run a separate dev Client Portal session.
    - from:
        - namespaceSelector:
            matchLabels:
              ithaca/role: data-gateway
              ithaca/environment: dev
          podSelector:
            matchLabels:
              ithaca/component: app
        - namespaceSelector:
            matchLabels:
              ithaca/role: workers
              ithaca/environment: dev
          podSelector:
            matchLabels:
              ithaca/component: worker
      ports:
        - protocol: TCP
          port: ${IBKR_ENGINE_PORT}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              ithaca/component: ibkr-gateway
      ports:
        - protocol: TCP
          port: 5000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ibkr-gateway-ingress-egress
  namespace: ${K8S_GATEWAY_NAMESPACE}
  labels:
    ithaca/component: ibkr-gateway
    ithaca/environment: ${ITHACA_ENV}
spec:
  podSelector:
    matchLabels:
      ithaca/component: ibkr-gateway
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # Only the Ithaca wrapper can call the private Client Portal API.
    - from:
        - podSelector:
            matchLabels:
              ithaca/component: ibkr-engine
        - podSelector:
            matchLabels:
              ithaca/component: ibkr-engine-keepalive
      ports:
        - protocol: TCP
          port: 5000
    # Caddy may reach the login/session port only while the temporary public
    # sign-in Caddy config is applied.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ithaca-gateway
          podSelector:
            matchLabels:
              ithaca/component: caddy
      ports:
        - protocol: TCP
          port: 5000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
