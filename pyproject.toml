# Virtual uv workspace root (no [project] of its own). Members are added as services
# come online (doomberg-core, services/*). Phase 0 ships only the contracts package.
[tool.uv.workspace]
members = [
    "packages/contracts/py",
    "doomberg-core",
    "services/data-archive",
    "services/platform",
    "services/mcp-gateway",
    "services/control-plane",
    "services/rest-gateway",
    "services/runtime",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["**/generated/**"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
